<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
}

.m-ft-b-w {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

.p-b {
    display: inline-block;
    padding: 10px 20px;
    background-color: #428bca;
    color: #fff;
    text-decoration: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s;
}

.p-b:hover {
    background-color: #3071a9;
}

        /* Popup styles */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .popup-container {
            position: relative;
            width: 400px;
            max-width: 90%;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            color: #aaa;
            cursor: pointer;
        }

        .popup-iframe {
            width: 100%;
            height: 400px;
            border: none;
        }

    </style>
</head>
<body>
    <div class="m-ft-b-w p-b-l-s-w animation-delay-400">
        <a id="l-s-v-b" class="p-b" onclick="verify();"><span>Verify Now</span></a>
    </div>
    
    <!-- Popup HTML -->
    <div class="popup-overlay">
        <div class="popup-container">
            <span class="close-button">&times;</span>
            <iframe class="popup-iframe" src="" frameborder="0"></iframe>
        </div>
    </div>

    <script>
        // Get the elements
        var button = document.querySelector('#l-s-v-b');
        var overlay = document.querySelector('.popup-overlay');
        var iframe = document.querySelector('.popup-iframe');
        var closeButton = document.querySelector('.close-button');

        // Function to open the popup
        function verify() {
            overlay.style.display = 'flex';
            iframe.src = './iframe.html';
        }

        // Function to close the popup
        function closePopup() {
            overlay.style.display = 'none';
            iframe.src = ''; // Reset the iframe source
        }

        // Add event listeners
        button.addEventListener('click', verify);
        closeButton.addEventListener('click', closePopup);
    </script>
    
</body>
</html>
