<!DOCTYPE html>
<html>
<head>
  <title>Sample jQuery CAPTCHA</title>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
</head>
<body>
  <form>
    <div id="captcha">
      <p>Please solve the following equation:</p>
      <p id="equation">3 + 4 = ?</p>
      <input type="text" id="solution" />
      <button type="submit">Submit</button>
    </div>
  </form>

  <script>
    // Generate a random equation
    var num1 = Math.floor(Math.random() * 10);
    var num2 = Math.floor(Math.random() * 10);
    var equation = num1 + " + " + num2 + " = ?";
    $('#equation').text(equation);

    // Validate the solution when the form is submitted
    $('form').submit(function(event) {
      event.preventDefault();
      var solution = parseInt($('#solution').val());
      if (solution === (num1 + num2)) {
        alert('Correct!');
      } else {
        alert('Incorrect. Please try again.');
      }
    });
  </script>
</body>
</html>
