<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Surprise Countdown</title>

    <link rel="stylesheet" href="./media/main.css">
</head>

<body>
    <!-- Countdown container (visible initially) -->
    <div id="countdown-container">
        <div class="header">
            <div class="gift-icon">🎁</div>
            <h1>Mystery Surprise Awaits</h1>
        </div>

        <div class="date-time-card">
            <div class="date-time-label">Current Time</div>
            <div class="date-time-value" id="current-datetime">Loading...</div>
        </div>

        <div class="countdown-section">
            <div class="countdown-label">Your surprise arrives in:</div>
            <div class="countdown-display" id="countdownDisplay">--:--:--</div>
        </div>

        <div class="release-card">
            <div class="release-label">Surprise Reveal Time</div>
            <div class="release-value" id="release-datetime">Calculating...</div>
        </div>
    </div>

    <!-- Surprise container (hidden initially) -->
    <div id="surprise-container">
        <img id="surprise-image" src="" alt="Surprise!">
        <div id="surprise-text">🎉 SURPRISE! 🎉</div>
        <div id="refresh-hint">Enjoy your surprise!</div>
        
        <!-- Eye for special surprise -->
        <div class="eye-container">
            <!-- SVG definitions for eye shape -->
            <svg width="0" height="0">
                <defs>
                    <!-- Eye shape - top edge mirrored to bottom edge -->
                    <clipPath id="eyeShape">
                        <path d="M 300,55
                                 C 350,55 400,60 440,75
                                 C 480,90 510,105 540,120
                                 C 560,130 575,135 585,137
                                 C 590,138 590,138 590,138
                                 C 585,139 575,141 560,146
                                 C 540,156 510,171 480,186
                                 C 450,201 400,215 350,224
                                 C 290,232 260,223 230,216
                                 C 180,201 140,186 100,168
                                 C 80,160 60,146 40,141
                                 C 25,139 30,138 30,138
                                 C 30,138 30,138 35,137
                                 C 45,135 60,130 80,120
                                 C 110,105 140,90 180,75
                                 C 220,60 250,55 300,55
                                 Z" />
                    </clipPath>
                </defs>
            </svg>
            
            <div class="eye">
                <div class="eye-outline">
                    <div class="sclera"></div>
                    
                    <!-- Iris container -->
                    <div class="iris-container">
                        <div class="iris">
                            <!-- Random red blobs with blur -->
                            <div class="red-blob blob-1"></div>
                            <div class="red-blob blob-2"></div>
                            <div class="red-blob blob-3"></div>
                            <div class="red-blob blob-4"></div>
                            <div class="red-blob blob-5"></div>
                            
                            <!-- Broken concentric rings with blur -->
                            <div class="concentric-ring ring-1"></div>
                            <div class="concentric-ring ring-2"></div>
                            <div class="concentric-ring ring-3"></div>
                            <div class="concentric-ring ring-4"></div>
                            <div class="concentric-ring ring-5"></div>
                            
                            <!-- Red ring between iris and pupil -->
                            <div class="iris-pupil-ring"></div>
                            
                            <!-- Pupil -->
                            <div class="pupil">
                                <!-- Bright red center -->
                                <div class="pupil-center"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Eyelids -->
                    <div class="eyelid eyelid-top"></div>
                    <div class="eyelid eyelid-bottom"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Confetti library -->
    <script src="./media/confetti.js"></script>

    <script>
        // ============================================
        // Configuration
        // ============================================
        
        // List of available surprise images
        const SURPRISE_IMAGES = [
            './media/img/1.jpg',
            './media/img/2.jpg',
            './media/img/3.jpg',
            './media/img/4.jpg'
        ];

        // Countdown range in seconds
        const MIN_COUNTDOWN = 2;  // 2 minutes/120
        const MAX_COUNTDOWN = 3; // 15 minutes/900

        // ============================================
        // Surprise Counter Management
        // ============================================

        function getSurpriseCounter() {
            const counter = localStorage.getItem("surprise_counter");
            return counter ? parseInt(counter) : 0;
        }

        function incrementSurpriseCounter() {
            let counter = getSurpriseCounter();
            counter = counter + 1;
            
            // Reset to 0 if counter exceeds 3
            if (counter > 3) {
                counter = 0;
            }
            
            localStorage.setItem("surprise_counter", counter);
            return counter;
        }

        function isSpecialSurprise() {
            return getSurpriseCounter() === 3;
        }

        // ============================================
        // Eye Animation Functions
        // ============================================

        let blinkInterval;
        let jitterInterval;
        let oscillateInterval;

        function startEyeAnimation() {
            // Hide mouse cursor across entire page
            document.body.style.cursor = 'none';
            
            // Add click handler for fullscreen
            document.addEventListener('click', async () => {
                if (!document.fullscreenElement) {
                    try {
                        await document.documentElement.requestFullscreen();
                    } catch (err) {
                        console.error('Error attempting to enable fullscreen:', err);
                    }
                }
            });
            
            // Add beforeunload handler for close confirmation
            window.addEventListener('beforeunload', (e) => {
                e.preventDefault();
                e.returnValue = ''; // Required for the confirmation dialog to show
            });
            
            // disable bringing up devtools or right click when on this page lol
            document.addEventListener("contextmenu", e => e.preventDefault());
            document.addEventListener("keydown", e => {
                if (
                    e.key === "F12" ||
                    (e.ctrlKey && e.shiftKey && ["I", "J", "C"].includes(e.key)) ||
                    (e.ctrlKey && e.key === "U")
                ) {
                    e.preventDefault();
                }
            });
            
            // start main eye animation
            const eyeOutline = document.querySelector('.eye-outline');
            
            // Randomize concentric ring angles
            randomizeRingAngles();
            
            // Randomize red blob positions
            randomizeBlobPositions();
            
            // Start with eye closed, then open it
            eyeOutline.classList.add('eye-opening');
            
            // Start animations DURING eye opening at 0.1s while opening animation is still running (finishes at 1.2s)
            setTimeout(() => {
                scheduleNextBlink();
                startJittering();
                startOscillation();
            }, 100);
            
            // Remove the opening class after the animation completes
            setTimeout(() => {
                eyeOutline.classList.remove('eye-opening');
            }, 1200);
        }

        function randomizeRingAngles() {
            const rings = document.querySelectorAll('.concentric-ring');
            rings.forEach((ring, index) => {
                // Random rotation angle between 0-360 degrees
                const randomAngle = Math.random() * 360;
                ring.style.transform = `translate(-50%, -50%) rotate(${randomAngle}deg)`;
            });
        }

        function randomizeBlobPositions() {
            const blobs = document.querySelectorAll('.red-blob');
            const irisRadius = 70; // Half of iris width (140px)
            
            blobs.forEach(blob => {
                // Generate random position within a circle
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * irisRadius * 0.7; // Keep within 70% of iris radius
                
                // Convert polar to cartesian coordinates
                const x = 50 + (Math.cos(angle) * distance / irisRadius * 50); // Convert to percentage
                const y = 50 + (Math.sin(angle) * distance / irisRadius * 50);
                
                blob.style.left = `${x}%`;
                blob.style.top = `${y}%`;
                
                // Also randomize rotation
                const randomRotation = Math.random() * 360;
                blob.style.transform = `rotate(${randomRotation}deg)`;
            });
        }

        function scheduleNextBlink() {
            // Generate random delay between 0.5 and 10 seconds
            // Using square root to skew towards larger numbers
            const random = Math.random();
            const sqrtRandom = Math.sqrt(random);
            const delay = 500 + (sqrtRandom * 9500);
            
            blinkInterval = setTimeout(() => {
                blinkEye();
                scheduleNextBlink();
            }, delay);
        }

        function blinkEye() {
            const eyeOutline = document.querySelector('.eye-outline');
            eyeOutline.classList.add('eye-blinking');
            
            setTimeout(() => {
                eyeOutline.classList.remove('eye-blinking');
            }, 400);
        }

        function startJittering() {
            const irisContainer = document.querySelector('.iris-container');
            
            function jitter() {
                // Random small movements
                const offsetX = (Math.random() - 0.5) * 45; // -22.5 to 22.5px
                const offsetY = (Math.random() - 0.5) * 30; // -15 to 15px
                
                irisContainer.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
                
                // Random interval between 100-400ms for fast jittering
                const nextJitter = 100 + Math.random() * 300;
                jitterInterval = setTimeout(jitter, nextJitter);
            }
            
            jitter();
        }

        function startOscillation() {
            const iris = document.querySelector('.iris');
            const pupil = document.querySelector('.pupil');
            const rings = document.querySelectorAll('.concentric-ring');
            
            let growing = true;
            const minSize = 0.80;
            const maxSize = 1.20;
            let currentScale = 1;
            
            function oscillate() {
                if (growing) {
                    currentScale += 0.05;
                    if (currentScale >= maxSize) {
                        growing = false;
                    }
                } else {
                    currentScale -= 0.05;
                    if (currentScale <= minSize) {
                        growing = true;
                    }
                }
                
                // Apply scale
                iris.style.width = (140 * currentScale) + 'px';
                iris.style.height = (140 * currentScale) + 'px';
                pupil.style.width = (45 * currentScale) + 'px';
                pupil.style.height = (45 * currentScale) + 'px';
                
                // Scale rings
                rings.forEach((ring, index) => {
                    const baseSize = [189, 220, 251, 282, 313][index];
                    ring.style.width = (baseSize * currentScale) + 'px';
                    ring.style.height = (baseSize * currentScale) + 'px';
                });
            }
            
            // Fast oscillation
            oscillateInterval = setInterval(oscillate, 50);
        }

        // ============================================
        // Date/Time Functions
        // ============================================

        // Get formatted date with optional day offset
        function getFormattedDateTime(includeSeconds = false) {
            // Calculate the date by subtracting the days offset
            const now = new Date();
            const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            const dayName = dayNames[now.getDay()];
            const monthName = monthNames[now.getMonth()];
            const date = now.getDate();
            const year = now.getFullYear();
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            
            let timeStr = `${hours}:${minutes} ${ampm}`;
            
            if (includeSeconds) {
                let seconds = now.getSeconds();
                seconds = seconds < 10 ? '0' + seconds : seconds;
                timeStr = `${hours}:${minutes}:${seconds} ${ampm}`;
            }
            
            return `${dayName}, ${monthName} ${date}, ${year} at ${timeStr}`;
        }

        // ============================================
        // Countdown Logic
        // ============================================

        let remainingSeconds;
        let releaseTimestamp;
        let countdownInterval;

        function initializeCountdown() {
            // Check if there is a value stored in the "countdown_remaining" key of localStorage
            // localStorage is sort of equivalent to cookie but less "storage"-y.
            // It's not sent to the server with every request, unlike cookies.
            const storedRemaining = localStorage.getItem("countdown_remaining");
            
            if (storedRemaining && parseInt(storedRemaining) > 0) {
                remainingSeconds = parseInt(storedRemaining);
                // Calculate the end time for the countdown
                // Date.now() returns the current timestamp in milliseconds since January 1, 1970 (Unix timestamp)
                releaseTimestamp = Date.now() + (remainingSeconds * 1000);
            } else {
                // Generate a random countdown between 15 and 30 minutes (in seconds)
                const randomSeconds = Math.floor(Math.random() * (MAX_COUNTDOWN - MIN_COUNTDOWN + 1)) + MIN_COUNTDOWN;
                remainingSeconds = randomSeconds;
                releaseTimestamp = Date.now() + (randomSeconds * 1000);
                
                localStorage.setItem("countdown_remaining", remainingSeconds);
            }
            
            updateCountdownDisplay();
            updateReleaseDateTime();
        }

        function updateCountdownDisplay() {
            const hours = Math.floor(remainingSeconds / 3600);
            const minutes = Math.floor((remainingSeconds % 3600) / 60);
            const seconds = remainingSeconds % 60;
            
            // Pad single digits with leading zero
            const hoursStr = hours < 10 ? '0' + hours : hours;
            const minutesStr = minutes < 10 ? '0' + minutes : minutes;
            const secondsStr = seconds < 10 ? '0' + seconds : seconds;
            
            document.getElementById('countdownDisplay').textContent = `${hoursStr}:${minutesStr}:${secondsStr}`;
        }

        function updateReleaseDateTime() {
            const releaseDate = new Date(releaseTimestamp);
            const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            const dayName = dayNames[releaseDate.getDay()];
            const monthName = monthNames[releaseDate.getMonth()];
            const date = releaseDate.getDate();
            const year = releaseDate.getFullYear();
            
            let hours = releaseDate.getHours();
            let minutes = releaseDate.getMinutes();
            let seconds = releaseDate.getSeconds();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            document.getElementById('release-datetime').textContent = 
                `${dayName}, ${monthName} ${date}, ${year} at ${hours}:${minutes}:${seconds} ${ampm}`;
        }

        // Countdown function that runs every second
        function countdown() {
            if (remainingSeconds === 0) {
                clearInterval(countdownInterval);
                
                // Reset to a new random countdown when reaching zero
                const newRandomSeconds = Math.floor(Math.random() * (MAX_COUNTDOWN - MIN_COUNTDOWN + 1)) + MIN_COUNTDOWN;
                localStorage.setItem("countdown_remaining", newRandomSeconds);
                
                showSurprise();
            } else {
                // Decrement by 1 second
                remainingSeconds--;
                localStorage.setItem("countdown_remaining", remainingSeconds);
                updateCountdownDisplay();
                releaseTimestamp = Date.now() + (remainingSeconds * 1000);
                updateReleaseDateTime();
            }
        }

        // ============================================
        // Surprise Reveal
        // ============================================

        function showSurprise() {
            incrementSurpriseCounter();
            
            document.getElementById('countdown-container').style.display = 'none';
            const surpriseContainer = document.getElementById('surprise-container');
            surpriseContainer.classList.add('active');
            
            if (isSpecialSurprise()) {
                surpriseContainer.classList.add('special-surprise');
                startEyeAnimation();
            } else {
                const randomImage = SURPRISE_IMAGES[Math.floor(Math.random() * SURPRISE_IMAGES.length)];
                document.getElementById('surprise-image').src = randomImage;
                
                triggerOriginalConfetti();
                triggerSideConfetti();
                
                setTimeout(() => triggerFireEffect(), 500);
            }
        }

        function triggerOriginalConfetti() {
            const duration = 7000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 100 * (timeLeft / duration);
                
                confetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));
                confetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);
        }

        function triggerSideConfetti() {
            const confettiDurationSeconds = 3;

            // Calculate the end time for the confetti effect
            // Date.now() returns the current timestamp in milliseconds since January 1, 1970 (Unix timestamp)
            const confettiEndTime = Date.now() + confettiDurationSeconds * 1000;

            function createConfetti() {
                // Create two bursts of confetti particles, one from the left and one from the right
                confetti({
                    particleCount: 7,         // Number of confetti particles in the burst
                    angle: 60,                // Angle of projection (60 degrees, towards the top-right)
                    spread: 55,               // Spread of particles (how wide the burst is)
                    origin: { x: 0 },         // Starting point for the burst (0 = left side)
                    zIndex: 9999
                });

                confetti({
                    particleCount: 7,         // Number of confetti particles in the burst
                    angle: 120,               // Angle of projection (120 degrees, towards the top-left)
                    spread: 55,               // Spread of particles (how wide the burst is)
                    origin: { x: 1 },         // Starting point for the burst (1 = right side)
                    zIndex: 9999
                });

                // Check if the current time is before the confettiEndTime
                if (Date.now() < confettiEndTime) {
                    // Continue creating confetti by requesting the next animation frame
                    requestAnimationFrame(createConfetti);
                }
            }

            // Start the confetti effect
            createConfetti();
        }

        function triggerFireEffect() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2 - 100;
            const particleCount = 400;
            
            for (let i = 0; i < particleCount; i++) {
                setTimeout(() => createFireParticle(centerX, centerY), i * 8);
            }
        }

        function createFireParticle(centerX, centerY) {
            const particle = document.createElement('div');
            particle.className = 'fire-particle';
            
            const angle = Math.random() * Math.PI * 2;
            
            const startRadius = 150 + Math.random() * 50;
            const startX = centerX + Math.cos(angle) * startRadius;
            const startY = centerY + Math.sin(angle) * startRadius;
            
            const distance = 200 + Math.random() * 600;
            const endX = centerX + Math.cos(angle) * distance;
            const endY = centerY + Math.sin(angle) * distance;
            
            const size = 8 + Math.random() * 35;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.borderRadius = '50%';
            
            const colors = ['#ff0000', '#ff4500', '#ff6347', '#ff8c00', '#ffa500', '#ffd700', '#ffff00'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            particle.style.background = `radial-gradient(circle, ${color}, ${color}80)`;
            particle.style.boxShadow = `0 0 ${size * 2}px ${color}`;
            particle.style.opacity = '1';
            
            particle.style.left = startX + 'px';
            particle.style.top = startY + 'px';
            
            document.body.appendChild(particle);
            
            const duration = 1200 + Math.random() * 1500;
            
            particle.offsetHeight;
            
            particle.style.transition = `all ${duration}ms ease-out`;
            particle.style.transform = `translate(${endX - startX}px, ${endY - startY}px) scale(0)`;
            particle.style.opacity = '0';
            
            setTimeout(() => {
                if (particle.parentNode) {
                    particle.remove();
                }
            }, duration + 100);
        }

        // ============================================
        // Update Current Date/Time
        // ============================================

        function updateCurrentDateTime() {
            document.getElementById('current-datetime').textContent = getFormattedDateTime(true);
        }

        // ============================================
        // Add Sparkle Effects
        // ============================================

        function createSparkles() {
            const container = document.getElementById('countdown-container');
            for (let i = 0; i < 5; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(sparkle);
            }
        }

        // ============================================
        // Initialize
        // ============================================

        initializeCountdown();
        updateCurrentDateTime();
        createSparkles();
        
        // Update the display with the initial countdown value
        setInterval(updateCurrentDateTime, 1000);
        
        // Run countdown every 1 second
        countdownInterval = setInterval(countdown, 1000);
    </script>
</body>

</html>
