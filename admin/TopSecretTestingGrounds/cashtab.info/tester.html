<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Countdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #countdown-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 60px 80px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 90%;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.8s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 42px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .date-time-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(240, 147, 251, 0.3);
        }

        .date-time-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .date-time-value {
            font-size: 20px;
            font-weight: 600;
        }

        .countdown-section {
            text-align: center;
            margin: 40px 0;
        }

        .countdown-label {
            font-size: 24px;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .countdown-display {
            font-size: 72px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 5px;
            text-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            font-family: 'Courier New', monospace;
        }

        .release-card {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 25px 30px;
            border-radius: 15px;
            margin-top: 40px;
            box-shadow: 0 10px 30px rgba(168, 237, 234, 0.3);
        }

        .release-label {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .release-value {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }

        .gift-icon {
            font-size: 48px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        #surprise-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 1000;
            overflow: hidden;
        }

        #surprise-container.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #surprise-image {
            max-width: 70%;
            max-height: 60%;
            border-radius: 25px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            animation: scaleIn 1s ease-out;
            border: 8px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0.3) rotate(-5deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.05) rotate(2deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        #surprise-text {
            color: white;
            font-size: 64px;
            font-weight: 800;
            margin-top: 40px;
            text-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            animation: fadeInUp 1s ease-out 0.5s both;
            letter-spacing: 3px;
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        #refresh-hint {
            color: rgba(255, 255, 255, 0.8);
            font-size: 20px;
            margin-top: 30px;
            animation: fadeInUp 1s ease-out 1.5s both;
            font-style: italic;
        }

        /* Special black screen surprise styles */
        #surprise-container.special-surprise {
            background: #000000;
        }

        #surprise-container.special-surprise #surprise-image {
            display: none;
        }

        #surprise-container.special-surprise #surprise-text {
            display: none;
        }

        #surprise-container.special-surprise #refresh-hint {
            display: none;
        }

        /* Eye Animation Styles */
        .eye-container {
            display: none;
            position: relative;
            width: 600px;
            height: 300px;
        }

        #surprise-container.special-surprise .eye-container {
            display: block;
        }

        .eye {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        /* Eye shape - concave using SVG for smooth bezier curves */
        .eye-outline {
            position: absolute;
            width: 600px;
            height: 250px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000000;
            overflow: visible;
        }

        /* Sclera with red gradient - positioned from eye outline top */
        .sclera {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #FF0000;
            clip-path: url(#eyeShape);
        }

        /* Dark red overlay on top with heavily blurred edge */
        .sclera::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(
                to bottom,
                #5c0000 0%,
                #5c0000 70%,
                transparent 100%
            );
            filter: blur(20px);
        }

        /* Blood vessels - SVG paths for organic bezier curves */
        .blood-vessels {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Iris container - will jitter */
        .iris-container {
            position: absolute;
            top: 56%;
            left: 52%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out;
        }

        /* Iris (dark with oscillation) */
        .iris {
            position: absolute;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at center, #0d0000 0%, #000000 100%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease-in-out, height 0.3s ease-in-out;
        }

        /* Random red blobs inside iris */
        .red-blob {
            position: absolute;
            background: rgba(255, 0, 0, 0.3);
            border-radius: 50%;
            filter: blur(3px);
        }

        .blob-1 {
            width: 30px;
            height: 25px;
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        }

        .blob-2 {
            width: 25px;
            height: 35px;
            border-radius: 30% 70% 70% 30% / 40% 40% 60% 60%;
        }

        .blob-3 {
            width: 35px;
            height: 30px;
            border-radius: 70% 30% 50% 50% / 60% 40% 60% 40%;
        }

        .blob-4 {
            width: 20px;
            height: 28px;
            border-radius: 40% 60% 60% 40% / 70% 30% 70% 30%;
        }

        .blob-5 {
            width: 28px;
            height: 22px;
            border-radius: 50% 50% 30% 70% / 40% 60% 40% 60%;
        }

        /* Broken concentric rings - OUTSIDE the iris with blur filter */
        .concentric-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(0, 0, 0, 0.8);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease-in-out, height 0.3s ease-in-out;
            filter: blur(5px);
        }

        .ring-1 {
            width: 289px;
            height: 289px;
            background: conic-gradient(
                from 0deg,
                transparent 0deg 40deg,
                rgba(0, 0, 0, 0.8) 40deg 80deg,
                transparent 80deg 140deg,
                rgba(0, 0, 0, 0.8) 140deg 200deg,
                transparent 200deg 260deg,
                rgba(0, 0, 0, 0.8) 260deg 320deg,
                transparent 320deg 360deg
            );
            -webkit-mask: radial-gradient(circle, transparent 48%, black 48%, black 52%, transparent 52%);
            mask: radial-gradient(circle, transparent 48%, black 48%, black 52%, transparent 52%);
        }

        .ring-2 {
            width: 320px;
            height: 320px;
            background: conic-gradient(
                from 30deg,
                transparent 0deg 50deg,
                rgba(0, 0, 0, 0.7) 50deg 110deg,
                transparent 110deg 180deg,
                rgba(0, 0, 0, 0.7) 180deg 250deg,
                transparent 250deg 360deg
            );
            -webkit-mask: radial-gradient(circle, transparent 48%, black 48%, black 52%, transparent 52%);
            mask: radial-gradient(circle, transparent 48%, black 48%, black 52%, transparent 52%);
        }

        .ring-3 {
            width: 371px;
            height: 371px;
            background: conic-gradient(
                from 60deg,
                transparent 0deg 70deg,
                rgba(0, 0, 0, 0.6) 70deg 150deg,
                transparent 150deg 220deg,
                rgba(0, 0, 0, 0.6) 220deg 300deg,
                transparent 300deg 360deg
            );
            -webkit-mask: radial-gradient(circle, transparent 48%, black 48%, black 52%, transparent 52%);
            mask: radial-gradient(circle, transparent 48%, black 48%, black 52%, transparent 52%);
        }

        .ring-4 {
            width: 392px;
            height: 392px;
            background: conic-gradient(
                from 90deg,
                transparent 0deg 60deg,
                rgba(0, 0, 0, 0.5) 60deg 130deg,
                transparent 130deg 200deg,
                rgba(0, 0, 0, 0.5) 200deg 280deg,
                transparent 280deg 360deg
            );
            -webkit-mask: radial-gradient(circle, transparent 48%, black 48%, black 52%, transparent 52%);
            mask: radial-gradient(circle, transparent 48%, black 48%, black 52%, transparent 52%);
        }

        .ring-5 {
            width: 430px;
            height: 430px;
            background: conic-gradient(
                from 120deg,
                transparent 0deg 80deg,
                rgba(0, 0, 0, 0.4) 80deg 160deg,
                transparent 160deg 240deg,
                rgba(0, 0, 0, 0.4) 240deg 320deg,
                transparent 320deg 360deg
            );
            -webkit-mask: radial-gradient(circle, transparent 48%, black 48%, black 52%, transparent 52%);
            mask: radial-gradient(circle, transparent 48%, black 48%, black 52%, transparent 52%);
        }

        /* Red ring between iris and pupil - no blur */
        .iris-pupil-ring {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: conic-gradient(
                from 0deg,
                #FF0000 0deg 30deg,
                #CC0000 30deg 60deg,
                #FF0000 60deg 120deg,
                #DD0000 120deg 180deg,
                #FF0000 180deg 240deg,
                #CC0000 240deg 300deg,
                #FF0000 300deg 360deg
            );
            -webkit-mask: radial-gradient(circle, transparent 45%, black 45%, black 55%, transparent 55%);
            mask: radial-gradient(circle, transparent 45%, black 45%, black 55%, transparent 55%);
        }

        /* Pupil (dark black with oscillation) */
        .pupil {
            position: absolute;
            width: 45px;
            height: 45px;
            background: #000000;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(0, 0, 0, 1);
            transition: width 0.3s ease-in-out, height 0.3s ease-in-out;
        }

        /* Bright red center dot */
        .pupil-center {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #FF0000;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
        }

        /* Eyelids for blinking - just black, no outline */
        .eyelid {
            position: absolute;
            width: 100%;
            background: #000000;
            transition: none;
            z-index: 10;
        }

        .eyelid-top {
            top: 0;
            left: 0;
            height: 0%;
            transform-origin: bottom;
            clip-path: url(#eyeShape);
        }

        .eyelid-bottom {
            bottom: 0;
            left: 0;
            height: 0%;
            transform-origin: top;
            clip-path: url(#eyeShape);
        }

        /* Opening animation */
        @keyframes openEyeTop {
            0% {
                height: 85%;
            }
            100% {
                height: 0%;
            }
        }

        @keyframes openEyeBottom {
            0% {
                height: 15%;
            }
            100% {
                height: 0%;
            }
        }

        .eye-opening .eyelid-top {
            animation: openEyeTop 1.5s ease-out forwards;
        }

        .eye-opening .eyelid-bottom {
            animation: openEyeBottom 1.5s ease-out forwards;
        }

        /* Blinking animation */
        @keyframes blinkTop {
            0% {
                height: 0%;
            }
            50% {
                height: 85%;
            }
            100% {
                height: 0%;
            }
        }

        @keyframes blinkBottom {
            0% {
                height: 0%;
            }
            50% {
                height: 15%;
            }
            100% {
                height: 0%;
            }
        }

        .eye-blinking .eyelid-top {
            animation: blinkTop 0.5s ease-in-out;
        }

        .eye-blinking .eyelid-bottom {
            animation: blinkBottom 0.5s ease-in-out;
        }

        .fire-particle {
            position: fixed;
            pointer-events: none;
            z-index: 10001;
            will-change: transform, opacity;
        }

        /* Subtle background pattern */
        #countdown-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.1) 0%, transparent 50%);
            border-radius: 30px;
            z-index: -1;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkle 2s infinite;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <!-- Countdown container (visible initially) -->
    <div id="countdown-container">
        <div class="header">
            <div class="gift-icon">🎁</div>
            <h1>Mystery Surprise Awaits</h1>
        </div>

        <div class="date-time-card">
            <div class="date-time-label">Current Time</div>
            <div class="date-time-value" id="current-datetime">Loading...</div>
        </div>

        <div class="countdown-section">
            <div class="countdown-label">Your surprise arrives in:</div>
            <div class="countdown-display" id="countdownDisplay">--:--:--</div>
        </div>

        <div class="release-card">
            <div class="release-label">Surprise Reveal Time</div>
            <div class="release-value" id="release-datetime">Calculating...</div>
        </div>
    </div>

    <!-- Surprise container (hidden initially) -->
    <div id="surprise-container">
        <img id="surprise-image" src="" alt="Surprise!">
        <div id="surprise-text">🎉 SURPRISE! 🎉</div>
        <div id="refresh-hint">Enjoy your surprise!</div>
        
        <!-- Eye for special surprise -->
        <div class="eye-container">
            <!-- SVG definitions for eye shape -->
            <svg width="0" height="0">
                <defs>
                    <!-- Eye shape - top edge mirrored to bottom edge -->
                    <clipPath id="eyeShape">
                        <path d="M 300,55
                                 C 350,55 400,60 440,75
                                 C 480,90 510,105 540,120
                                 C 560,130 575,135 585,137
                                 C 590,138 590,138 590,138
                                 C 585,139 575,141 560,146
                                 C 540,156 510,171 480,186
                                 C 450,201 400,215 350,224
                                 C 290,232 260,223 230,216
                                 C 180,201 140,186 100,168
                                 C 80,160 60,146 40,141
                                 C 25,139 30,138 30,138
                                 C 30,138 30,138 35,137
                                 C 45,135 60,130 80,120
                                 C 110,105 140,90 180,75
                                 C 220,60 250,55 300,55
                                 Z" />
                    </clipPath>
                </defs>
            </svg>
            
            <div class="eye">
                <div class="eye-outline">
                    <div class="sclera"></div>
                    
                    <!-- Iris container (jitters) -->
                    <div class="iris-container">
                        <!-- Iris with oscillation -->
                        <div class="iris">
                            <!-- Random red blobs with blur -->
                            <div class="red-blob blob-1"></div>
                            <div class="red-blob blob-2"></div>
                            <div class="red-blob blob-3"></div>
                            <div class="red-blob blob-4"></div>
                            <div class="red-blob blob-5"></div>
                            
                            <!-- Broken concentric rings with blur -->
                            <div class="concentric-ring ring-1"></div>
                            <div class="concentric-ring ring-2"></div>
                            <div class="concentric-ring ring-3"></div>
                            <div class="concentric-ring ring-4"></div>
                            <div class="concentric-ring ring-5"></div>
                            
                            <!-- Red ring between iris and pupil -->
                            <div class="iris-pupil-ring"></div>
                            
                            <!-- Pupil -->
                            <div class="pupil">
                                <!-- Bright red center -->
                                <div class="pupil-center"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Eyelids -->
                    <div class="eyelid eyelid-top"></div>
                    <div class="eyelid eyelid-bottom"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Confetti library -->
    <script src="./confetti.js"></script>

    <script>
        // ============================================
        // Configuration
        // ============================================
        
        // List of available surprise images (add more as needed)
        const SURPRISE_IMAGES = [
            './media/img/1.jpg',
            './media/img/2.jpg',
            './media/img/3.jpg',
            './media/img/4.jpg'
        ];

        // Countdown range in seconds (15 to 30 minutes)
        const MIN_COUNTDOWN = 2;  // 15 minutes/900
        const MAX_COUNTDOWN = 3; // 30 minutes/1800

        // ============================================
        // Surprise Counter Management
        // ============================================

        function getSurpriseCounter() {
            const counter = localStorage.getItem("surprise_counter");
            return counter ? parseInt(counter) : 0;
        }

        function incrementSurpriseCounter() {
            let counter = getSurpriseCounter();
            counter = counter + 1;
            
            // Reset to 0 if counter exceeds 3
            if (counter > 3) {
                counter = 0;
            }
            
            localStorage.setItem("surprise_counter", counter);
            return counter;
        }

        function isSpecialSurprise() {
            return getSurpriseCounter() === 3;
        }

        // ============================================
        // Eye Animation Functions
        // ============================================

        let blinkInterval;
        let jitterInterval;
        let oscillateInterval;

        function startEyeAnimation() {
            const eyeOutline = document.querySelector('.eye-outline');
            
            // Randomize concentric ring angles
            randomizeRingAngles();
            
            // Randomize red blob positions
            randomizeBlobPositions();
            
            // Start with eye closed, then open it
            eyeOutline.classList.add('eye-opening');
            
            // After 1.5 seconds (opening duration), start all animations
            setTimeout(() => {
                eyeOutline.classList.remove('eye-opening');
                scheduleNextBlink();
                startJittering();
                startOscillation();
            }, 500);
        }

        function randomizeRingAngles() {
            const rings = document.querySelectorAll('.concentric-ring');
            rings.forEach((ring, index) => {
                // Random rotation angle between 0-360 degrees
                const randomAngle = Math.random() * 360;
                ring.style.transform = `translate(-50%, -50%) rotate(${randomAngle}deg)`;
            });
        }

        function randomizeBlobPositions() {
            const blobs = document.querySelectorAll('.red-blob');
            const irisRadius = 70; // Half of iris width (140px)
            
            blobs.forEach(blob => {
                // Generate random position within a circle
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * irisRadius * 0.7; // Keep within 70% of iris radius
                
                // Convert polar to cartesian coordinates
                const x = 50 + (Math.cos(angle) * distance / irisRadius * 50); // Convert to percentage
                const y = 50 + (Math.sin(angle) * distance / irisRadius * 50);
                
                blob.style.left = `${x}%`;
                blob.style.top = `${y}%`;
                
                // Also randomize rotation
                const randomRotation = Math.random() * 360;
                blob.style.transform = `rotate(${randomRotation}deg)`;
            });
        }

        function scheduleNextBlink() {
            // Generate random delay between 0.5 and 10 seconds
            // Using square root to favor larger numbers
            const random = Math.random();
            const sqrtRandom = Math.sqrt(random);
            const delay = 500 + (sqrtRandom * 9500);
            
            blinkInterval = setTimeout(() => {
                blinkEye();
                scheduleNextBlink();
            }, delay);
        }

        function blinkEye() {
            const eyeOutline = document.querySelector('.eye-outline');
            eyeOutline.classList.add('eye-blinking');
            
            setTimeout(() => {
                eyeOutline.classList.remove('eye-blinking');
            }, 500);
        }

        function startJittering() {
            const irisContainer = document.querySelector('.iris-container');
            
            function jitter() {
                // Random small movements - increased by 200% (3x multiplier)
                const offsetX = (Math.random() - 0.5) * 45; // -22.5 to 22.5px
                const offsetY = (Math.random() - 0.5) * 30; // -15 to 15px
                
                irisContainer.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
                
                // Random interval between 100-400ms for fast jittering
                const nextJitter = 100 + Math.random() * 300;
                jitterInterval = setTimeout(jitter, nextJitter);
            }
            
            jitter();
        }

        function startOscillation() {
            const iris = document.querySelector('.iris');
            const pupil = document.querySelector('.pupil');
            const rings = document.querySelectorAll('.concentric-ring');
            
            let growing = true;
            const minSize = 0.80;
            const maxSize = 1.20;
            let currentScale = 1;
            
            function oscillate() {
                if (growing) {
                    currentScale += 0.05;
                    if (currentScale >= maxSize) {
                        growing = false;
                    }
                } else {
                    currentScale -= 0.05;
                    if (currentScale <= minSize) {
                        growing = true;
                    }
                }
                
                // Apply scale
                iris.style.width = (140 * currentScale) + 'px';
                iris.style.height = (140 * currentScale) + 'px';
                pupil.style.width = (45 * currentScale) + 'px';
                pupil.style.height = (45 * currentScale) + 'px';
                
                // Scale rings
                rings.forEach((ring, index) => {
                    const baseSize = [189, 220, 251, 282, 313][index];
                    ring.style.width = (baseSize * currentScale) + 'px';
                    ring.style.height = (baseSize * currentScale) + 'px';
                });
            }
            
            // Fast oscillation - every 50ms
            oscillateInterval = setInterval(oscillate, 50);
        }

        // ============================================
        // Date/Time Functions
        // ============================================

        function getFormattedDateTime(includeSeconds = false) {
            const now = new Date();
            const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            const dayName = dayNames[now.getDay()];
            const monthName = monthNames[now.getMonth()];
            const date = now.getDate();
            const year = now.getFullYear();
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            
            let timeStr = `${hours}:${minutes} ${ampm}`;
            
            if (includeSeconds) {
                let seconds = now.getSeconds();
                seconds = seconds < 10 ? '0' + seconds : seconds;
                timeStr = `${hours}:${minutes}:${seconds} ${ampm}`;
            }
            
            return `${dayName}, ${monthName} ${date}, ${year} at ${timeStr}`;
        }

        // ============================================
        // Countdown Logic
        // ============================================

        let remainingSeconds;
        let releaseTimestamp;
        let countdownInterval;

        function initializeCountdown() {
            const storedRemaining = localStorage.getItem("countdown_remaining");
            
            if (storedRemaining && parseInt(storedRemaining) > 0) {
                remainingSeconds = parseInt(storedRemaining);
                releaseTimestamp = Date.now() + (remainingSeconds * 1000);
            } else {
                const randomSeconds = Math.floor(Math.random() * (MAX_COUNTDOWN - MIN_COUNTDOWN + 1)) + MIN_COUNTDOWN;
                remainingSeconds = randomSeconds;
                releaseTimestamp = Date.now() + (randomSeconds * 1000);
                
                localStorage.setItem("countdown_remaining", remainingSeconds);
            }
            
            updateCountdownDisplay();
            updateReleaseDateTime();
        }

        function updateCountdownDisplay() {
            const hours = Math.floor(remainingSeconds / 3600);
            const minutes = Math.floor((remainingSeconds % 3600) / 60);
            const seconds = remainingSeconds % 60;
            
            const hoursStr = hours < 10 ? '0' + hours : hours;
            const minutesStr = minutes < 10 ? '0' + minutes : minutes;
            const secondsStr = seconds < 10 ? '0' + seconds : seconds;
            
            document.getElementById('countdownDisplay').textContent = `${hoursStr}:${minutesStr}:${secondsStr}`;
        }

        function updateReleaseDateTime() {
            const releaseDate = new Date(releaseTimestamp);
            const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            const dayName = dayNames[releaseDate.getDay()];
            const monthName = monthNames[releaseDate.getMonth()];
            const date = releaseDate.getDate();
            const year = releaseDate.getFullYear();
            
            let hours = releaseDate.getHours();
            let minutes = releaseDate.getMinutes();
            let seconds = releaseDate.getSeconds();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            document.getElementById('release-datetime').textContent = 
                `${dayName}, ${monthName} ${date}, ${year} at ${hours}:${minutes}:${seconds} ${ampm}`;
        }

        function countdown() {
            if (remainingSeconds === 0) {
                clearInterval(countdownInterval);
                
                const newRandomSeconds = Math.floor(Math.random() * (MAX_COUNTDOWN - MIN_COUNTDOWN + 1)) + MIN_COUNTDOWN;
                localStorage.setItem("countdown_remaining", newRandomSeconds);
                
                showSurprise();
            } else {
                remainingSeconds--;
                localStorage.setItem("countdown_remaining", remainingSeconds);
                updateCountdownDisplay();
                releaseTimestamp = Date.now() + (remainingSeconds * 1000);
                updateReleaseDateTime();
            }
        }

        // ============================================
        // Surprise Reveal
        // ============================================

        function showSurprise() {
            incrementSurpriseCounter();
            
            document.getElementById('countdown-container').style.display = 'none';
            const surpriseContainer = document.getElementById('surprise-container');
            surpriseContainer.classList.add('active');
            
            if (isSpecialSurprise()) {
                surpriseContainer.classList.add('special-surprise');
                startEyeAnimation();
            } else {
                const randomImage = SURPRISE_IMAGES[Math.floor(Math.random() * SURPRISE_IMAGES.length)];
                document.getElementById('surprise-image').src = randomImage;
                
                triggerOriginalConfetti();
                triggerSideConfetti();
                
                setTimeout(() => triggerFireEffect(), 500);
            }
        }

        function triggerOriginalConfetti() {
            const duration = 7000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 100 * (timeLeft / duration);
                
                confetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));
                confetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);
        }

        function triggerSideConfetti() {
            const confettiDurationSeconds = 3;
            const confettiEndTime = Date.now() + confettiDurationSeconds * 1000;

            function createConfetti() {
                confetti({
                    particleCount: 7,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    zIndex: 9999
                });

                confetti({
                    particleCount: 7,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    zIndex: 9999
                });

                if (Date.now() < confettiEndTime) {
                    requestAnimationFrame(createConfetti);
                }
            }

            createConfetti();
        }

        function triggerFireEffect() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const particleCount = 400;
            
            for (let i = 0; i < particleCount; i++) {
                setTimeout(() => createFireParticle(centerX, centerY), i * 8);
            }
        }

        function createFireParticle(centerX, centerY) {
            const particle = document.createElement('div');
            particle.className = 'fire-particle';
            
            const angle = Math.random() * Math.PI * 2;
            
            const startRadius = 150 + Math.random() * 50;
            const startX = centerX + Math.cos(angle) * startRadius;
            const startY = centerY + Math.sin(angle) * startRadius;
            
            const distance = 200 + Math.random() * 600;
            const endX = centerX + Math.cos(angle) * distance;
            const endY = centerY + Math.sin(angle) * distance;
            
            const size = 8 + Math.random() * 35;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.borderRadius = '50%';
            
            const colors = ['#ff0000', '#ff4500', '#ff6347', '#ff8c00', '#ffa500', '#ffd700', '#ffff00'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            particle.style.background = `radial-gradient(circle, ${color}, ${color}80)`;
            particle.style.boxShadow = `0 0 ${size * 2}px ${color}`;
            particle.style.opacity = '1';
            
            particle.style.left = startX + 'px';
            particle.style.top = startY + 'px';
            
            document.body.appendChild(particle);
            
            const duration = 1200 + Math.random() * 1500;
            
            particle.offsetHeight;
            
            particle.style.transition = `all ${duration}ms ease-out`;
            particle.style.transform = `translate(${endX - startX}px, ${endY - startY}px) scale(0)`;
            particle.style.opacity = '0';
            
            setTimeout(() => {
                if (particle.parentNode) {
                    particle.remove();
                }
            }, duration + 100);
        }

        // ============================================
        // Update Current Date/Time
        // ============================================

        function updateCurrentDateTime() {
            document.getElementById('current-datetime').textContent = getFormattedDateTime(true);
        }

        // ============================================
        // Add Sparkle Effects
        // ============================================

        function createSparkles() {
            const container = document.getElementById('countdown-container');
            for (let i = 0; i < 5; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(sparkle);
            }
        }

        // ============================================
        // Initialize
        // ============================================

        initializeCountdown();
        updateCurrentDateTime();
        createSparkles();
        
        setInterval(updateCurrentDateTime, 1000);
        
        countdownInterval = setInterval(countdown, 1000);
    </script>
</body>
