<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Countdown</title>
    <style>
        body { background: #1a1714; margin: 0; }
    </style>
</head>
<body>
    <script>
        // 30% chance of view1 (original), 70% chance of view2 (new)
        const target = Math.random() < 0.3 ? 'view1.html' : 'view2.html';
        window.location.replace(target);
    </script>
</body>
</html>
