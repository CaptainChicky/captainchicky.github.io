<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space</title>
    <meta name="author" content="Captain Chicky">
    <meta name="description" content="A dynamically generated interstellar space experience. GOOS inside!">
    <meta name="keywords" content="space, captain chicky, sun, earth, planet, goose, goos, planets, suns, comet, comets">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --space-black: #000000;
            --space-purple: #1a0b2e;
            --space-blue: #0f0f23;
            --star-white: #ffffff;
            --star-blue: #b8d8ff;
            --star-yellow: #fff9b0;
            --star-red: #ffb8b0;
            --cosmic-glow: rgba(138, 43, 226, 0.3);
        }
        
        body {
            background: radial-gradient(ellipse at bottom, var(--space-purple) 0%, var(--space-black) 100%);
            color: var(--star-white);
            font-family: 'Space Mono', monospace;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }
        
        #space-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 400vh;
            z-index: 1;
            pointer-events: none;
        }
        
        .content {
            position: relative;
            z-index: 10;
            min-height: 400vh;
            width: 100%;
        }
        
        .arrival {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            animation: slideUp 1s ease-out;
            padding: 2rem;
            z-index: 100; /* Above canvas so text is readable */
        }
        
        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(50px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            background: linear-gradient(45deg, #fff, #b8d8ff, #fff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
            margin-bottom: 2rem;
        }
        
        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .index-section {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 15px;
            padding: 2rem;
            margin: 2rem auto;
            max-width: 800px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: pulseGlow 3s ease-in-out infinite;
        }
        
        @keyframes pulseGlow {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(138, 43, 226, 0.3),
                            inset 0 0 20px rgba(138, 43, 226, 0.1);
                border-color: rgba(138, 43, 226, 0.3);
            }
            50% { 
                box-shadow: 0 0 40px rgba(138, 43, 226, 0.6),
                            inset 0 0 30px rgba(138, 43, 226, 0.2);
                border-color: rgba(138, 43, 226, 0.6);
            }
        }
        
        .index-section u {
            font-size: 1.2rem;
            color: #b8d8ff;
        }
        
        ul {
            list-style: none;
            margin-top: 1.5rem;
        }
        
        li {
            margin: 0.8rem 0;
            padding-left: 1.5rem;
            position: relative;
        }
        
        li:before {
            content: "✦";
            position: absolute;
            left: 0;
            color: #b8d8ff;
            animation: twinkle 2s ease-in-out infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        ul ul {
            margin-left: 2rem;
        }
        
        ul ul li:before {
            content: "→";
            color: rgba(255, 255, 255, 0.5);
        }
        
        a {
            color: #00ffff;
            text-decoration: none;
            position: relative;
            transition: all 0.3s ease;
        }
        
        a:hover {
            color: #fff;
            text-shadow: 0 0 10px #00ffff;
        }
        
        a:after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #00ffff, transparent);
            transition: width 0.3s ease;
        }
        
        a:hover:after {
            width: 100%;
        }
        
        /* Shooting stars */
        .shooting-star {
            position: fixed;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px white;
            animation: shoot 3s linear;
            z-index: 5;
        }
        
        @keyframes shoot {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: translate(-300px, 300px);
                opacity: 0;
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .content {
                padding: 1rem;
            }
            
            .index-section {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="space-canvas"></canvas>
    
    <div class="content">
        <div class="arrival">
            <h1>Oh hey, you made it!</h1>
            
            <div class="index-section">
                <u>😋 Here's my astronomy, physics, &c articles index if that's what you were looking for :D</u>
                
                <ul>
                    <li>Compact Objects:
                        <ul>
                            <li>White Dwarfs</li>
                            <li>Neutron Stars</li>
                            <li>Ultradense Stars</li>
                            <li><a href="./Articles/Compact Objects/Black-Holes/index.html">Black Holes</a></li>
                        </ul>
                    </li>
                    <br>
                    <li>Particle Physics:
                        <ul>
                            <li><a href="./Articles/Particle-Physics/Neutrinos/neutrino_e.html">A neutrino can easily penetrate the earth. (joke)</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        
        let mouseX = 0;
        let mouseY = 0;
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 4; // 4x viewport height
        }
        
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            // Clear everything and reinitialize
            stars = [];
            planets = [];
            celestialStars = [];
            galaxies = [];
            floatingTexts = [];
            pulsars = [];
            goose = null;
            rocket = null;
            earthPlanet = null;
            quasar = null;
            comet = null;
            lastCometTime = Date.now();
            milkyWayStars = [];
            globularClusters = [];
            milkyWayDustPatches = [];
            milkyWayCanvas = null; // Clear cached Milky Way canvas
            
            // Reinitialize everything with same angles
            initStars();
        });
        
        // Mouse parallax
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.01;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.01;
        });
        
        // Star system
        class Star {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                
                // Random drift in any direction, slower speeds
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 0.03; // Max speed 0.03
                this.speedX = Math.cos(angle) * speed;
                this.speedY = Math.sin(angle) * speed;
                
                // Color variation
                const colorRand = Math.random();
                if (colorRand < 0.7) {
                    this.color = '#ffffff';
                } else if (colorRand < 0.85) {
                    this.color = '#b8d8ff';
                } else if (colorRand < 0.95) {
                    this.color = '#fff9b0';
                } else {
                    this.color = '#ffb8b0';
                }
                
                this.opacity = Math.random() * 0.5 + 0.5;
                this.twinkleSpeed = Math.random() * 0.02 + 0.01;
                this.twinklePhase = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                // Wrap around screen edges
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
                
                this.twinklePhase += this.twinkleSpeed;
            }
            
            draw() {
                const twinkle = Math.sin(this.twinklePhase) * 0.3 + 0.7;
                ctx.globalAlpha = this.opacity * twinkle;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Glow effect for larger stars
                if (this.size > 1) {
                    ctx.globalAlpha = (this.opacity * twinkle) * 0.3;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        // Celestial Stars (actual suns)
        class CelestialStar {
            constructor(x, y, size, color, type) {
                this.x = x;
                this.y = y;
                this.baseSize = size;
                this.size = size;
                this.color = color;
                this.type = type;
                this.pulsePhase = 0;
            }
            
            update() {
                this.pulsePhase += 0.02;
                // Pulse range: 0.95 to 1.10
                const pulse = Math.sin(this.pulsePhase) * 0.075 + 1.025;
                this.size = this.baseSize * pulse;
            }
            
            draw() {
                const pulse = this.size / this.baseSize;
                
                // Outer glow
                const glowGradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * 4 * pulse
                );
                glowGradient.addColorStop(0, this.color + 'ff');
                glowGradient.addColorStop(0.2, this.color + 'aa');
                glowGradient.addColorStop(0.5, this.color + '33');
                glowGradient.addColorStop(1, 'transparent');
                
                ctx.globalAlpha = 0.6;
                ctx.fillStyle = glowGradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 4 * pulse, 0, Math.PI * 2);
                ctx.fill();
                
                // Core glow
                const coreGradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * pulse
                );
                coreGradient.addColorStop(0, '#ffffff');
                coreGradient.addColorStop(0.6, this.color);
                coreGradient.addColorStop(1, this.color + 'cc');
                
                ctx.globalAlpha = 1;
                ctx.fillStyle = coreGradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * pulse, 0, Math.PI * 2);
                ctx.fill();
                
                // Haze for red dwarf
                if (this.type === 'red-dwarf') {
                    ctx.globalAlpha = 0.3;
                    ctx.fillStyle = this.color + '22';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 6 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        // Planets
        class Planet {
            constructor(sunX, sunY, orbitRadius, size, type, details) {
                this.sunX = sunX;
                this.sunY = sunY;
                this.orbitRadius = orbitRadius;
                this.size = size;
                this.type = type;
                this.details = details;
                this.orbitSpeed = 0.0003 / (orbitRadius / 100);
                this.angle = Math.random() * Math.PI * 2;
                
                // Generate landmasses once
                if (this.type === 'rocky') {
                    this.landmasses = [];
                    const numLandmasses = 3;
                    for (let i = 0; i < numLandmasses; i++) {
                        this.landmasses.push({
                            offsetX: (Math.random() - 0.5) * this.size * 1.5,
                            offsetY: (Math.random() - 0.5) * this.size * 1.5,
                            landSize: this.size * (Math.random() * 0.4 + 0.3)
                        });
                    }
                    
                    // Generate random features once
                    this.features = [];
                    const numFeatures = Math.floor(Math.random() * 3) + 2;
                    for (let i = 0; i < numFeatures; i++) {
                        this.features.push({
                            offsetX: (Math.random() - 0.5) * this.size * 1.2,
                            offsetY: (Math.random() - 0.5) * this.size * 1.2,
                            featureSize: this.size * (Math.random() * 0.2 + 0.1),
                            isOval: Math.random() > 0.5,
                            rotation: Math.random() * Math.PI
                        });
                    }
                }
            }
            
            update() {
                this.angle += this.orbitSpeed;
            }
            
            draw() {
                const currentX = this.sunX + Math.cos(this.angle) * this.orbitRadius;
                const currentY = this.sunY + Math.sin(this.angle) * this.orbitRadius * 0.3;
                
                // Draw rings (full ring first) if ringed
                if (this.type === 'ringed') {
                    this.drawFullRing(currentX, currentY);
                }
                
                // Draw Uranus full ring before planet if Uranus
                if (this.type === 'ice-giant' && this.details.color === '#4fd0e7') {
                    ctx.globalAlpha = 0.5;
                    ctx.strokeStyle = '#888888';
                    ctx.lineWidth = this.size * 0.3;
                    ctx.beginPath();
                    ctx.ellipse(currentX, currentY, this.size * 0.2, this.size * 1.5, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    ctx.strokeStyle = '#aaaaaa';
                    ctx.lineWidth = this.size * 0.15;
                    ctx.beginPath();
                    ctx.ellipse(currentX, currentY, this.size * 0.25, this.size * 1.7, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                // Planet glow
                const gradient = ctx.createRadialGradient(
                    currentX, currentY, 0,
                    currentX, currentY, this.size * 1.5
                );
                gradient.addColorStop(0, this.details.color);
                gradient.addColorStop(0.7, this.details.color + '44');
                gradient.addColorStop(1, 'transparent');
                
                ctx.globalAlpha = 0.3;
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(currentX, currentY, this.size * 1.5, 0, Math.PI * 2);
                ctx.fill();
                
                // Planet body with gradient
                ctx.globalAlpha = 1;
                const planetGradient = ctx.createRadialGradient(
                    currentX - this.size * 0.3, currentY - this.size * 0.3, 0,
                    currentX, currentY, this.size
                );
                planetGradient.addColorStop(0, this.details.color);
                planetGradient.addColorStop(0.7, this.details.color2);
                planetGradient.addColorStop(1, this.details.color3);
                
                ctx.fillStyle = planetGradient;
                ctx.beginPath();
                ctx.arc(currentX, currentY, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Surface details
                if (this.type === 'gas-giant' || this.type === 'ringed') {
                    // Bands (elliptical, smaller at poles) - skip top band
                    ctx.globalAlpha = 0.4;
                    for (let i = 1; i < 5; i++) { // Start from 1 to skip top band
                        const bandY = currentY - this.size + (this.size * 2 * (i / 5));
                        const distFromEquator = Math.abs((i / 5) - 0.5) * 2;
                        const radiusX = this.size * 0.9 * (1 - distFromEquator * 0.3);
                        
                        ctx.strokeStyle = this.details.bandColor;
                        ctx.lineWidth = this.size * 0.12;
                        ctx.beginPath();
                        ctx.ellipse(currentX, bandY, radiusX, this.size * 0.08, 0, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    
                    // Red spot for Jupiter (first gas giant)
                    if (this.type === 'gas-giant' && this.details.color === '#d4a574') {
                        ctx.globalAlpha = 0.7;
                        ctx.fillStyle = '#c1440e';
                        ctx.beginPath();
                        ctx.ellipse(currentX + this.size * 0.3, currentY + this.size * 0.2, this.size * 0.25, this.size * 0.15, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (this.type === 'rocky') {
                    // Draw landmass from pre-generated data
                    ctx.globalAlpha = 0.6;
                    ctx.fillStyle = this.details.landColor;
                    
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(currentX, currentY, this.size, 0, Math.PI * 2);
                    ctx.clip();
                    
                    // Use pre-generated landmasses
                    this.landmasses.forEach(land => {
                        ctx.beginPath();
                        ctx.arc(currentX + land.offsetX, currentY + land.offsetY, land.landSize, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    
                    // Use pre-generated features
                    ctx.globalAlpha = 0.3;
                    ctx.strokeStyle = this.details.landColor;
                    ctx.lineWidth = this.size * 0.05;
                    
                    this.features.forEach(feature => {
                        ctx.beginPath();
                        if (feature.isOval) {
                            ctx.ellipse(
                                currentX + feature.offsetX, 
                                currentY + feature.offsetY, 
                                feature.featureSize * 1.5, 
                                feature.featureSize * 0.8, 
                                feature.rotation, 
                                0, 
                                Math.PI * 2
                            );
                        } else {
                            ctx.arc(currentX + feature.offsetX, currentY + feature.offsetY, feature.featureSize, 0, Math.PI * 2);
                        }
                        ctx.stroke();
                    });
                    
                    ctx.restore();
                } else if (this.type === 'ice-giant') {
                    // Neptune has more atmospheric features and spots
                    if (this.details.color === '#4169e1') {
                        // Multiple atmospheric bands (skip top one)
                        ctx.globalAlpha = 0.3;
                        for (let i = 1; i < 6; i++) {
                            const bandY = currentY - this.size + (this.size * 2 * (i / 6));
                            ctx.strokeStyle = this.details.featureColor;
                            ctx.lineWidth = this.size * 0.06;
                            ctx.beginPath();
                            ctx.ellipse(currentX, bandY, this.size * 0.8, this.size * 0.1, 0, 0, Math.PI * 2);
                            ctx.stroke();
                        }
                        
                        // Dark spot
                        ctx.globalAlpha = 0.6;
                        ctx.fillStyle = '#0a1f4a';
                        ctx.beginPath();
                        ctx.ellipse(currentX - this.size * 0.2, currentY, this.size * 0.3, this.size * 0.2, 0, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Small white spot
                        ctx.globalAlpha = 0.5;
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(currentX + this.size * 0.4, currentY - this.size * 0.3, this.size * 0.1, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    // Uranus gets full ring before planet, then left half after
                }
                
                // Draw Uranus ring (left half) if Uranus
                if (this.type === 'ice-giant' && this.details.color === '#4fd0e7') {
                    this.drawUranusRingHalf(currentX, currentY);
                }
                
                // Draw rings (bottom half only) if ringed
                if (this.type === 'ringed') {
                    this.drawBottomRing(currentX, currentY);
                }
            }
            
            drawFullRing(x, y) {
                ctx.globalAlpha = 0.6;
                ctx.save();
                
                // Draw full rings
                ctx.strokeStyle = this.details.ringColor;
                ctx.lineWidth = this.size * 0.4;
                ctx.beginPath();
                ctx.ellipse(x, y, this.size * 1.8, this.size * 0.25, 0, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.strokeStyle = this.details.ringColor2;
                ctx.lineWidth = this.size * 0.2;
                ctx.beginPath();
                ctx.ellipse(x, y, this.size * 2.2, this.size * 0.3, 0, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.restore();
            }
            
            drawBottomRing(x, y) {
                ctx.globalAlpha = 0.6;
                ctx.save();
                ctx.translate(x, y);
                
                // Clip to bottom half only
                ctx.beginPath();
                ctx.rect(-this.size * 3, 0, this.size * 6, this.size * 3);
                ctx.clip();
                
                ctx.strokeStyle = this.details.ringColor;
                ctx.lineWidth = this.size * 0.4;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * 1.8, this.size * 0.25, 0, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.strokeStyle = this.details.ringColor2;
                ctx.lineWidth = this.size * 0.2;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * 2.2, this.size * 0.3, 0, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.restore();
            }
            
            drawUranusRingHalf(x, y) {
                ctx.globalAlpha = 0.5;
                ctx.save();
                ctx.translate(x, y);
                
                // Clip to left half only
                ctx.beginPath();
                ctx.rect(-this.size * 3, -this.size * 3, this.size * 3, this.size * 6);
                ctx.clip();
                
                ctx.strokeStyle = '#888888';
                ctx.lineWidth = this.size * 0.3;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * 0.2, this.size * 1.5, 0, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.strokeStyle = '#aaaaaa';
                ctx.lineWidth = this.size * 0.15;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * 0.25, this.size * 1.7, 0, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.restore();
            }
        }
        
        // Galaxy class
        class Galaxy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.size = Math.random() * 40 + 30;
                this.rotation = Math.random() * Math.PI * 2;
                this.opacity = Math.random() * 0.3 + 0.2;
                
                // For irregular galaxies, generate blob positions once
                if (this.type === 'irregular') {
                    this.blobs = [];
                    for (let i = 0; i < 5; i++) {
                        this.blobs.push({
                            offsetX: (Math.random() - 0.5) * this.size,
                            offsetY: (Math.random() - 0.5) * this.size * 0.6,
                            blobSize: this.size * 0.4
                        });
                    }
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                
                // Add blur for all galaxies
                ctx.filter = 'blur(3px)';
                
                if (this.type === 'spiral' || this.type === 'barred') {
                    // Blurry halo background
                    const haloGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * 1.5);
                    haloGradient.addColorStop(0, '#b8d8ff22');
                    haloGradient.addColorStop(0.5, '#b8d8ff11');
                    haloGradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = haloGradient;
                    ctx.fillRect(-this.size * 1.5, -this.size * 1.5, this.size * 3, this.size * 3);
                    
                    // Core
                    const coreGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * 0.3);
                    coreGradient.addColorStop(0, '#fff9b0');
                    coreGradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = coreGradient;
                    ctx.fillRect(-this.size * 0.3, -this.size * 0.3, this.size * 0.6, this.size * 0.6);
                    
                    // Bar for barred spirals
                    if (this.type === 'barred') {
                        ctx.fillStyle = '#fff9b044';
                        ctx.fillRect(-this.size * 0.5, -this.size * 0.05, this.size, this.size * 0.1);
                    }
                    
                    // Spiral arms
                    for (let arm = 0; arm < 2; arm++) {
                        ctx.strokeStyle = '#b8d8ff44';
                        ctx.lineWidth = this.size * 0.15;
                        ctx.beginPath();
                        for (let i = 0; i < 50; i++) {
                            const angle = (i / 50) * Math.PI * 2 + arm * Math.PI;
                            const radius = (i / 50) * this.size;
                            const x = Math.cos(angle) * radius;
                            const y = Math.sin(angle) * radius * 0.5;
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.stroke();
                    }
                } else if (this.type === 'elliptical') {
                    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
                    gradient.addColorStop(0, '#fff9b0');
                    gradient.addColorStop(0.5, '#b8d8ff33');
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'lenticular') {
                    // Lenticular galaxy - disk-like with bright core
                    const diskGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
                    diskGradient.addColorStop(0, '#fff9b088');
                    diskGradient.addColorStop(0.3, '#b8d8ff44');
                    diskGradient.addColorStop(0.7, '#b8d8ff22');
                    diskGradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = diskGradient;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 1.2, this.size * 0.25, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Bright core
                    const coreGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * 0.3);
                    coreGradient.addColorStop(0, '#ffffff');
                    coreGradient.addColorStop(0.5, '#fff9b0');
                    coreGradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = coreGradient;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'irregular') {
                    ctx.fillStyle = '#b8d8ff33';
                    // Use pre-generated blobs
                    this.blobs.forEach(blob => {
                        ctx.beginPath();
                        ctx.arc(blob.offsetX, blob.offsetY, blob.blobSize, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
                
                ctx.filter = 'none';
                ctx.restore();
            }
        }
        
        // Quasar
        class Quasar {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 30;
                this.pulsePhase = 0;
                this.rotation = Math.random() * Math.PI * 2; // Random 0-360 degrees
                
                // Generate dust patches once
                this.dustPatches = [];
                for (let i = 0; i < 5; i++) {
                    this.dustPatches.push({
                        offsetX: (Math.random() - 0.5) * this.size * 0.4,
                        patchWidth: this.size * (0.4 + Math.random() * 0.3)
                    });
                }
            }
            
            update() {
                this.pulsePhase += 0.01;
            }
            
            draw() {
                const pulse = Math.sin(this.pulsePhase) * 0.1 + 1;
                
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation); // Apply random rotation
                
                // Main blue-white core
                ctx.filter = 'blur(12px)';
                const coreGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * pulse * 1.2);
                coreGradient.addColorStop(0, '#ffffff');
                coreGradient.addColorStop(0.2, '#b8d8ffcc');
                coreGradient.addColorStop(0.5, '#4169e188');
                coreGradient.addColorStop(1, 'transparent');
                
                ctx.globalAlpha = 0.9;
                ctx.fillStyle = coreGradient;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * pulse * 0.9, this.size * 0.35 * pulse, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Narrow red tinge around the blue-white core
                ctx.filter = 'blur(8px)';
                const redGradient = ctx.createRadialGradient(0, 0, this.size * pulse * 0.7, 0, 0, this.size * pulse * 1.1);
                redGradient.addColorStop(0, 'transparent');
                redGradient.addColorStop(0.5, '#ff444466');
                redGradient.addColorStop(1, 'transparent');
                
                ctx.globalAlpha = 0.6;
                ctx.fillStyle = redGradient;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * pulse * 1.0, this.size * 0.4 * pulse, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Patchy dark dust band (less blur - 70% of original)
                ctx.filter = 'blur(4px)'; // Was 6px, now 4px
                ctx.globalAlpha = 0.6;
                ctx.fillStyle = '#00000088';
                
                // Use pre-generated patches
                this.dustPatches.forEach(patch => {
                    ctx.fillRect(patch.offsetX - patch.patchWidth / 2, -this.size * 0.15, patch.patchWidth, this.size * 0.3);
                });
                
                // Jets (expanding cones - less blur)
                const jetLength = this.size * 4;
                const jetBaseWidth = this.size * 0.1;
                const jetEndWidth = this.size * 0.8;
                
                ctx.filter = 'blur(5px)'; // Was 8px
                
                // Top jet
                const jetGradientTop = ctx.createLinearGradient(0, -jetLength, 0, 0);
                jetGradientTop.addColorStop(0, 'transparent');
                jetGradientTop.addColorStop(0.3, '#b8d8ff22');
                jetGradientTop.addColorStop(0.7, '#b8d8ff55');
                jetGradientTop.addColorStop(1, '#b8d8ff88');
                
                ctx.globalAlpha = 0.6;
                ctx.fillStyle = jetGradientTop;
                ctx.beginPath();
                ctx.moveTo(-jetBaseWidth, 0);
                ctx.lineTo(-jetEndWidth, -jetLength);
                ctx.lineTo(jetEndWidth, -jetLength);
                ctx.lineTo(jetBaseWidth, 0);
                ctx.fill();
                
                // Bottom jet
                const jetGradientBottom = ctx.createLinearGradient(0, 0, 0, jetLength);
                jetGradientBottom.addColorStop(0, '#b8d8ff88');
                jetGradientBottom.addColorStop(0.3, '#b8d8ff55');
                jetGradientBottom.addColorStop(0.7, '#b8d8ff22');
                jetGradientBottom.addColorStop(1, 'transparent');
                
                ctx.fillStyle = jetGradientBottom;
                ctx.beginPath();
                ctx.moveTo(-jetBaseWidth, 0);
                ctx.lineTo(-jetEndWidth, jetLength);
                ctx.lineTo(jetEndWidth, jetLength);
                ctx.lineTo(jetBaseWidth, 0);
                ctx.fill();
                
                ctx.filter = 'none';
                ctx.restore();
            }
        }
        
        // Floating text
        class FloatingText {
            constructor(text) {
                this.text = text;

                this.speedY = Math.sin(angle) * speed;
                
                // Pulsing opacity setup
                this.opacity = Math.random(); // start at random opacity
                this.pulseSpeed = 0.002 + Math.random() * 0.003; // slower pulse speed
                this.pulseDirection = Math.random() < 0.5 ? 1 : -1; // initial pulse direction
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                // Wrap around canvas edges
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
                

                // Pulsing opacity (clamped)
                this.opacity += this.pulseSpeed * this.pulseDirection;
                if (this.opacity > 1) {
                    this.opacity = 1;
                    this.pulseDirection = -1;
                }
                if (this.opacity < 0.4) {
                    this.opacity = 0.4;
                    this.pulseDirection = 1;
                }
            }
            
            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#ffffff';
                ctx.font = '20px "Space Mono", monospace';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
                ctx.shadowBlur = 10;
                ctx.fillText(this.text, this.x, this.y);
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1; // reset for other drawings
            }
        }
        
        // Pulsar
        class Pulsar {
            constructor(x, y) {
                this.x = x;
                this.y = y;

                const maxSize = 3;
                const minSize = maxSize / 5;
                this.size = minSize + Math.random() * (maxSize - minSize);
                
                this.phase = 0;
                this.pulseInterval = 0.05 + Math.random() * 0.20; // Random interval between 0.05–0.25 seconds
                this.pulseDuration = this.pulseInterval;
                this.rotation = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.phase += 0.016; // ~60fps
                if (this.phase >= this.pulseDuration) {
                    this.phase = 0;
                }
            }
            
            draw() {
                const isWhite = this.phase < this.pulseDuration / 2;
                
                if (isWhite) {
                    // White phase with halo and diffraction spikes
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    
                    // Halo
                    const haloGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * 4);
                    haloGradient.addColorStop(0, '#ffffffaa');
                    haloGradient.addColorStop(0.5, '#ffffff44');
                    haloGradient.addColorStop(1, 'transparent');
                    
                    ctx.globalAlpha = 0.8;
                    ctx.fillStyle = haloGradient;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Diffraction spikes (4 rays)
                    ctx.globalAlpha = 0.6;
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 0.5;
                    for (let i = 0; i < 4; i++) {
                        const angle = (i * Math.PI / 2);
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(Math.cos(angle) * this.size * 6, Math.sin(angle) * this.size * 6);
                        ctx.stroke();
                    }
                    
                    // Core
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.restore();
                } else {
                    // Black phase (almost invisible)
                    ctx.globalAlpha = 0.1;
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        // Comet
        class Comet {
            constructor(sunX, sunY, GM = 5000) {
                this.sunX = sunX;
                this.sunY = sunY;
                this.GM = GM; // Gravitational parameter, tweak for effect
                
                // Start at random edge
                const edge = Math.floor(Math.random() * 4);
                if (edge === 0) { // Top
                    this.x = Math.random() * canvas.width;
                    this.y = 0;
                } else if (edge === 1) { // Right
                    this.x = canvas.width;
                    this.y = Math.random() * canvas.height;
                } else if (edge === 2) { // Bottom
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height;
                } else { // Left
                    this.x = 0;
                    this.y = Math.random() * canvas.height;
                }
                
                // Direction roughly toward sun (+/- 25 degrees)
                const angleToSun = Math.atan2(sunY - this.y, sunX - this.x);
                const buffer = (Math.random() - 0.5) * (50 * Math.PI / 180); // ±25°
                const angle = angleToSun + buffer;
                
                // Distance to sun
                const r = Math.hypot(this.x - sunX, this.y - sunY);
                // Escape velocity with margin
                const vEsc = Math.sqrt(2 * GM / r);
                const speed = vEsc * (1.05 + Math.random() * (2 - 1.05)); // 1.05x - 2x
                
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                // Array of possible comet dust colors
                const cometColors = [
                    '#ffffff', // white
                    '#b8ffb8', // green
                    '#a0c4ff', // blue
                    '#ffd580', // yellow-orange
                    '#ffb8f0', // pink
                    '#c080ff', // purple
                ];

                // Pick a random color from the array
                this.dustColor = cometColors[Math.floor(Math.random() * cometColors.length)];
                this.hasIonTail = Math.random() < 0.333; // ~1/3 of comets

                // Core gradient (blob)
                const coreColors = [
                    ['#ffffff', '#ffffaa'], // normal white-yellow core
                    ['#ffffff', '#a8ffb8'], // white-green halo
                    ['#ffffff', '#ffb8f0'], // white-pink halo
                ];

                this.selectedCore = coreColors[Math.floor(Math.random() * coreColors.length)];
            }

            update(dt = 1, sunRadius = 50) {
                // Vector from comet to sun
                const dx = this.sunX - this.x;
                const dy = this.sunY - this.y;
                const r = Math.hypot(dx, dy);
                this.distanceToSun = r; // store it so draw() can use it
                
                // Softening factor
                const epsilon = 30; // tweak this to control curvature vs speed
                
                // Acceleration toward Sun with softening
                const a = this.GM / (r * r + epsilon * epsilon);
                const ax = a * (dx / r);
                const ay = a * (dy / r);
                
                // Update velocity
                this.vx += ax * dt;
                this.vy += ay * dt;
                
                // Update position
                this.x += this.vx * dt;
                this.y += this.vy * dt;
            }
            
            isOffscreen() {
                return this.x < -1000 || this.x > canvas.width + 1000 || 
                       this.y < -1000 || this.y > canvas.height + 1000;
            }

            isInsideSun(sunRadius = 50) {
                const dx = this.x - this.sunX;
                const dy = this.y - this.sunY;
                const r = Math.hypot(dx, dy);
                return r < sunRadius;
            }
            
            draw() {
                const dx = this.x - this.sunX;
                const dy = this.y - this.sunY;
                const angleFromSun = Math.atan2(dy, dx);
                
                // Tail length increases as it approaches sun
                const maxTailLength = 200;
                // Tail grows faster as it gets closer
                const tailLength = maxTailLength * (1 - Math.exp(-1000 / this.distanceToSun));  
                
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Main tail (dust tail) - points away from sun
                ctx.filter = 'blur(8px)';
                const dustGradient = ctx.createLinearGradient(0, 0, 
                    Math.cos(angleFromSun) * tailLength, 
                    Math.sin(angleFromSun) * tailLength
                );
                dustGradient.addColorStop(0, this.dustColor + 'aa');
                dustGradient.addColorStop(0.5, this.dustColor + '44');
                dustGradient.addColorStop(1, 'transparent');
                
                ctx.globalAlpha = 0.7;
                ctx.strokeStyle = dustGradient;
                ctx.lineWidth = 18;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(angleFromSun) * tailLength, Math.sin(angleFromSun) * tailLength);
                ctx.stroke();
                
                // Ion tail (blue, smaller, slightly offset)
                if (this.hasIonTail) {
                    const ionOffset = Math.PI * 0.15; // 27 degrees offset
                    const ionLength = tailLength * 0.7;
                    const ionGradient = ctx.createLinearGradient(0, 0,
                        Math.cos(angleFromSun + ionOffset) * ionLength,
                        Math.sin(angleFromSun + ionOffset) * ionLength
                    );
                    ionGradient.addColorStop(0, 'rgba(180, 255, 255, 1)');  // almost white neon blue at base
                    ionGradient.addColorStop(0.5, 'rgba(100, 220, 255, 0.7)'); // softer, still bright blue
                    ionGradient.addColorStop(1, 'transparent');             // fade out
                    
                    ctx.globalAlpha = 0.7;
                    ctx.strokeStyle = ionGradient;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(angleFromSun + ionOffset) * ionLength, 
                               Math.sin(angleFromSun + ionOffset) * ionLength);
                    ctx.stroke();
                }
                
                ctx.filter = 'blur(5px)';

                const coreGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 8);
                coreGradient.addColorStop(0, this.selectedCore[0]);
                coreGradient.addColorStop(0.5, this.selectedCore[1]);
                coreGradient.addColorStop(1, 'transparent');
                
                ctx.globalAlpha = 1;
                ctx.fillStyle = coreGradient;
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.filter = 'none';
                ctx.restore();
            }
        }

        // Rocket
        class Rocket {
            constructor(earthX, earthY, earthSize) {
                this.size = earthSize * 0.8;
                // Start near earth
                this.x = earthX + earthSize + 20;
                this.y = earthY;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = 0.2; // 2x of 0.1
                this.speedX = Math.cos(angle) * speed;
                this.speedY = Math.sin(angle) * speed;
                
                this.angle = angle;
                this.targetAngle = angle;
                this.angleChangeSpeed = 0.02;
                this.nextAngleChangeTime = Date.now() + Math.random() * 3000 + 2000;
                
                this.loadImage();
            }
            
            loadImage() {
                this.img = new Image();
                this.img.src = './index_files/rocket.svg';
            }
            
            update() {
                // Move
                this.x += this.speedX;
                this.y += this.speedY;
                
                // Wrap around
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
                
                // Update angle smoothly
                const now = Date.now();
                if (now > this.nextAngleChangeTime) {
                    this.targetAngle = Math.random() * Math.PI * 2;
                    this.nextAngleChangeTime = now + Math.random() * 3000 + 2000;
                }
                
                // Smoothly rotate to target
                let angleDiff = this.targetAngle - this.angle;
                // Normalize to -PI to PI
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                
                if (Math.abs(angleDiff) > this.angleChangeSpeed) {
                    this.angle += Math.sign(angleDiff) * this.angleChangeSpeed;
                } else {
                    this.angle = this.targetAngle;
                }
                
                // Update velocity based on angle
                this.speedX = Math.cos(this.angle) * 0.2; // 2x of 0.1
                this.speedY = Math.sin(this.angle) * 0.2;
            }
            
            draw() {
                if (!this.img.complete || !this.img.naturalWidth) return;
                
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                ctx.shadowBlur = 15;
                
                ctx.globalAlpha = 1;
                ctx.drawImage(this.img, -this.size / 2, -this.size / 2, this.size, this.size);
                
                ctx.restore();
            }
        }

                }),
                new Planet(sunX, sunY, 390, 12, 'rocky', {
                    color: '#4a90e2',
                    color2: '#2563a8',
                    color3: '#1a4a7a',
                    landColor: '#5fa34a'
                }),
                new Planet(sunX, sunY, 510, 10, 'rocky', {
                    color: '#c1440e',
                    color2: '#993610',
                    color3: '#7a2b0d',
                    landColor: '#d4580e'
                }),
                new Planet(sunX, sunY, 750, 20, 'gas-giant', {
                    color: '#d4a574',
                    color2: '#b8875a',
                    color3: '#9a6f47',
                    bandColor: '#8c5f3f'
                }),
                new Planet(sunX, sunY, 990, 18, 'ringed', {
                    color: '#f4e7c3',
                    color2: '#d9c89e',
                    color3: '#bfaa7a',
                    bandColor: '#a8936a',
                    ringColor: '#d9c89e',
                    ringColor2: '#bfaa7a'
                }),
                new Planet(sunX, sunY, 1200, 14, 'ice-giant', {
                    color: '#4fd0e7',
                    color2: '#2eb3cc',
                    color3: '#1a8a9f',
                    featureColor: '#1a8a9f'
                }),
                new Planet(sunX, sunY, 1410, 14, 'ice-giant', {
                    color: '#4169e1',
                    color2: '#2952b8',
                    color3: '#1a3a8f',
                    featureColor: '#1a3a8f'
                })
            ];
            
            // Store earth planet reference
            earthPlanet = planets[1];
            
            // Generate galaxies - ensure at least one of each type
            galaxies = [];
            const galaxyTypes = ['spiral', 'barred', 'irregular', 'elliptical', 'lenticular'];
            
            // First, add one of each type
            galaxyTypes.forEach((type, index) => {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                galaxies.push(new Galaxy(x, y, type));
            });
            
            // Then add 11 more random ones to reach 16 total
            for (let i = 0; i < 11; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const type = galaxyTypes[Math.floor(Math.random() * galaxyTypes.length)];
                galaxies.push(new Galaxy(x, y, type));
            }
            
            // Floating texts - spread across full canvas
            floatingTexts = [
                new FloatingText('Where am I?'),
                new FloatingText('Where am high?'),
                new FloatingText('Why am I high?'),
                new FloatingText('Fleeting as stardust...')
            ];
            
            // Pulsars - 4-5 random positions
            pulsars = [];
            const pulsarCount = 4 + Math.floor(Math.random() * 2); // 4 or 5
            for (let i = 0; i < pulsarCount; i++) {
                pulsars.push(new Pulsar(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height
                ));
            }
            
            // Goose
            goose = new Goose();
            
            // Quasar in random position
            quasar = new Quasar(Math.random() * canvas.width, Math.random() * canvas.height);
            
            // Generate static Milky Way stars once - 10x more, heavily tapered distribution
            const bandLength = Math.max(canvas.width, canvas.height) * 2.5;
            const bandWidth = 200;
            milkyWayStars = [];
            for (let i = 0; i < 2300; i++) {
                // Generate position with heavy preference towards center
                const xRandom = Math.random() - 0.5;
                const yRandom = Math.random() - 0.5;
                const normalizedX = xRandom * 2; // -1 to 1
                const normalizedY = yRandom * 2; // -1 to 1
                const distanceFromCenterX = Math.abs(normalizedX);
                const distanceFromCenterY = Math.abs(normalizedY);
                
                // Quartic falloff along band for very dramatic taper
                const probabilityX = Math.pow(1 - distanceFromCenterX, 4); // Quartic falloff
                const probabilityY = Math.pow(1 - distanceFromCenterY, 2); // Quadratic falloff vertically
                const totalProbability = probabilityX * probabilityY;
                
                if (Math.random() > totalProbability) {
                    i--; // Retry this iteration
                    continue;
                }
                
                milkyWayStars.push({
                    x: xRandom * bandLength,
                    y: yRandom * bandWidth,
                    size: Math.random() * 1.5,
                    opacity: Math.random() * 0.6 + 0.3
                });
            }
            
            // Generate globular cluster positions
            globularClusters = [];
            const bulgeSize = 300; // Size of central bulge
            for (let i = 0; i < 12; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = bulgeSize * 0.7 + Math.random() * bulgeSize * 0.5;
                globularClusters.push({
                    x: Math.cos(angle) * distance,
                    y: Math.sin(angle) * distance * 0.5,
                    size: 8 + Math.random() * 8
                });
            }
            
            // Generate patchy dust band positions once
            milkyWayDustPatches = [];
            for (let i = 0; i < 25; i++) {
                const x = (Math.random() - 0.5) * bandLength;
                const patchWidth = bandLength * (0.03 + Math.random() * 0.05);
                milkyWayDustPatches.push({
                    x: x,
                    width: patchWidth
                });
            }
            
            // Rocket (will be created after first frame when earth position is known)
            
            // Create offscreen canvas for Milky Way (render once for performance)
            createMilkyWayCanvas();
        }
        
        // Render Milky Way to offscreen canvas once
        function createMilkyWayCanvas() {
            milkyWayCanvas = document.createElement('canvas');
            const size = Math.max(canvas.width, canvas.height) * 3;
            milkyWayCanvas.width = size;
            milkyWayCanvas.height = size;
            const offCtx = milkyWayCanvas.getContext('2d');
            
            const bandWidth = 200;
            const bandLength = Math.max(canvas.width, canvas.height) * 2.5;
            const bulgeSize = 300;
            
            offCtx.save();
            offCtx.translate(size / 2, size / 2);
            offCtx.rotate(milkyWayAngle);
            
            // Central bulge
            offCtx.filter = 'blur(25px)';
            const bulgeGradient = offCtx.createRadialGradient(0, 0, 0, 0, 0, bulgeSize);
            bulgeGradient.addColorStop(0, '#fff9b0aa');
            bulgeGradient.addColorStop(0.3, '#ffcc6688');
            bulgeGradient.addColorStop(0.6, '#ff993344');
            bulgeGradient.addColorStop(1, 'transparent');
            
            offCtx.globalAlpha = 0.3;
            offCtx.fillStyle = bulgeGradient;
            offCtx.beginPath();
            offCtx.ellipse(0, 0, bulgeSize, bulgeSize * 0.6, 0, 0, Math.PI * 2);
            offCtx.fill();
            
            // Globular clusters
            offCtx.filter = 'blur(6px)';
            globularClusters.forEach(cluster => {
                const clusterGradient = offCtx.createRadialGradient(
                    cluster.x, cluster.y, 0,
                    cluster.x, cluster.y, cluster.size
                );
                clusterGradient.addColorStop(0, '#fff9b0cc');
                clusterGradient.addColorStop(0.5, '#ffcc6666');
                clusterGradient.addColorStop(1, 'transparent');
                
                offCtx.globalAlpha = 0.6;
                offCtx.fillStyle = clusterGradient;
                offCtx.beginPath();
                offCtx.arc(cluster.x, cluster.y, cluster.size, 0, Math.PI * 2);
                offCtx.fill();
            });
            
            // Light band
            offCtx.filter = 'blur(35px)';
            const gradient = offCtx.createLinearGradient(-bandLength / 2, 0, bandLength / 2, 0);
            gradient.addColorStop(0, 'transparent');
            gradient.addColorStop(0.2, '#b8d8ff05');
            gradient.addColorStop(0.35, '#b8d8ff12');
            gradient.addColorStop(0.5, '#b8d8ff25');
            gradient.addColorStop(0.65, '#b8d8ff12');
            gradient.addColorStop(0.8, '#b8d8ff05');
            gradient.addColorStop(1, 'transparent');
            
            offCtx.globalAlpha = 1;
            offCtx.fillStyle = gradient;
            offCtx.fillRect(-bandLength / 2, -bandWidth / 2, bandLength, bandWidth);
            
            offCtx.filter = 'none';
            
            // Stars
            milkyWayStars.forEach(star => {
                offCtx.globalAlpha = star.opacity;
                offCtx.fillStyle = '#ffffff';
                offCtx.beginPath();
                offCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                offCtx.fill();
            });
            
            // Dark band
            offCtx.filter = 'blur(25px)';
            const darkGradient = offCtx.createLinearGradient(0, -bandWidth / 2, 0, bandWidth / 2);
            darkGradient.addColorStop(0, 'transparent');
            darkGradient.addColorStop(0.3, 'transparent');
            darkGradient.addColorStop(0.5, '#000000a8');
            darkGradient.addColorStop(0.7, 'transparent');
            darkGradient.addColorStop(1, 'transparent');
            
            offCtx.fillStyle = darkGradient;
            offCtx.fillRect(-bandLength / 2, -bandWidth / 2, bandLength, bandWidth);
            
            offCtx.globalAlpha = 0.6;
            offCtx.fillStyle = '#000000';
            milkyWayDustPatches.forEach(patch => {
                offCtx.fillRect(patch.x - patch.width / 2, -bandWidth * 0.15, patch.width, bandWidth * 0.3);
            });
            
            offCtx.filter = 'none';
            
            // Sparse stars over dark band
            offCtx.globalAlpha = 1;
            for (let i = 0; i < 50; i++) {
                const starIndex = Math.floor(Math.random() * milkyWayStars.length);
                const star = milkyWayStars[starIndex];
                if (Math.abs(star.y) < 30) {
                    offCtx.globalAlpha = star.opacity * 0.5;
                    offCtx.fillStyle = '#ffffff';
                    offCtx.beginPath();
                    offCtx.arc(star.x, star.y, star.size * 0.8, 0, Math.PI * 2);
                    offCtx.fill();
                }
            }
            
            offCtx.restore();
        }
        
        // Milky Way - optimized to draw from cached canvas
        function drawMilkyWay() {
            if (!milkyWayCanvas) return;
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const size = milkyWayCanvas.width;
            
            // Draw the pre-rendered Milky Way canvas
            ctx.drawImage(milkyWayCanvas, centerX - size / 2, centerY - size / 2);
        }
        
        initStars();
        
        let frameCount = 0;
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw distant galaxies (furthest)
            galaxies.forEach(galaxy => galaxy.draw());
            
            // Update and draw quasar (behind Milky Way)
            if (quasar) {
                quasar.update();
                quasar.draw();
            }
            
            // Draw Milky Way (in front of quasar and galaxies)
            drawMilkyWay();
            
            // Update and draw background stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            
            // Update and draw pulsars
            pulsars.forEach(pulsar => {
                pulsar.update();
                pulsar.draw();
            });
            
            // Update and draw celestial stars
            celestialStars.forEach(star => {
                star.update();
                star.draw();
            });
            
            // Update and draw planets
            planets.forEach(planet => {
                planet.update();
                planet.draw();
            });
            
            // Create rocket after first frame
            if (!rocket && frameCount > 1 && earthPlanet) {
                const earthX = earthPlanet.sunX + Math.cos(earthPlanet.angle) * earthPlanet.orbitRadius;
                const earthY = earthPlanet.sunY + Math.sin(earthPlanet.angle) * earthPlanet.orbitRadius * 0.3;
                rocket = new Rocket(earthX, earthY, earthPlanet.size);
            }
            
            // Update and draw rocket
            if (rocket) {
                rocket.update();
                rocket.draw();
            }
            
            // Spawn comet every 30 seconds
            const now = Date.now();
            if (!comet && now - lastCometTime > 30000 && celestialStars.length > 0) {
                const sun = celestialStars.find(s => s.type === 'sun');
                if (sun) {
                    comet = new Comet(sun.x, sun.y);
                    lastCometTime = now;
                }
            }
            
            // Update and draw comet
            if (comet) {
                comet.update();
                comet.draw();
                
                if (comet.isOffscreen() || comet.isInsideSun()) {
                    comet = null;
                }
            }
            
            // Update and draw floating texts
            floatingTexts.forEach(text => {
                text.update();
                text.draw();
            });
            
            // Update and draw goose
            if (goose) {
                goose.update();
                goose.draw();
            }
            
            // Apply parallax offset
            ctx.save();
            ctx.translate(mouseX, mouseY);
            ctx.restore();
            
            ctx.globalAlpha = 1;
            frameCount++;
            requestAnimationFrame(animate);
        }
        
        animate();
        
        // Shooting stars
        function createShootingStar() {
            const shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            shootingStar.style.top = Math.random() * 100 + '%';
            shootingStar.style.left = Math.random() * 100 + '%';
            document.body.appendChild(shootingStar);
            
            setTimeout(() => shootingStar.remove(), 3000);
        }
        
        setInterval(() => {
            if (Math.random() < 0.45) { // 1.5x of 0.3 = 0.45
                createShootingStar();
            }
        }, 2000);
    </script>
</body>
