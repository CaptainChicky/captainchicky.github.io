<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<style>
		@font-face {
			font-family: 'Roboto';
			font-style: normal;
			font-weight: 400;
			src: url(./roboto400.woff2) format('woff2');
			unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
		}

		@font-face {
			font-family: 'Roboto';
			font-style: normal;
			font-weight: 500;
			src: url(./roboto500latinextended.woff2) format('woff2');
			unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
		}

		@font-face {
			font-family: 'Roboto';
			font-style: normal;
			font-weight: 700;
			src: url(./roboto700.woff2) format('woff2');
			unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
		}
	</style>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			position: relative;
		}

		html {
			font-size: 15px;
			overflow: hidden;
		}

		html,
		body {
			width: 100%;
			height: 100%;
		}

		body {
			font-family: 'Roboto', sans-serif;
			background: transparent;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		body.closing {
			animation: fadeOut 0.3s ease-in forwards;
		}

		body.spinning {
			animation: spinAndFadeOut 0.8s ease-in-out forwards;
		}

		.popup {
			width: 100%;
			max-width: 500px;
			height: 190px;
			padding: 5px;
		}

		.popup-wrapper {
			background: #fff;
			width: 100%;
			border-radius: 10px;
			padding: 20px;
			box-shadow: 0 0 3px rgba(0, 0, 0, 0.2);
		}

		.popup-header {
			display: flex;
			flex-direction: row;
			align-items: center;
			font-size: 1.1rem;
			font-weight: 500;
			text-transform: uppercase;
			margin-bottom: 11px;
		}

		.popup-icon {
			width: 200px;
			margin-right: 14px;
		}

		.popup-text {
			font-size: 1rem;
			line-height: 1.2rem;
			font-weight: 400;
			display: -webkit-box;
			-webkit-box-orient: vertical;
			-webkit-line-clamp: 3;
			line-clamp: 3;
			max-height: 54px;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.popup-text p {
			margin-bottom: 3px;
		}

		.popup-text p:last-child {
			margin-bottom: 0;
		}

		b {
			font-weight: 700;
		}

		.popup-buttons {
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: flex-end;
			margin-top: 16px;
		}

		.popup-button {
			background: none;
			border: none;
			cursor: pointer;
			color: #319cff;
			text-transform: uppercase;
			font-size: 1.1rem;
			font-weight: 700;
			padding: 0;
		}

		.popup-button.cancel {
			color: #bfbfbf;
			padding: 0 28px;
		}

		@keyframes fadeOut {
			0% {
				opacity: 1;
			}

			100% {
				opacity: 0;
			}
		}

		@keyframes spinAndFadeOut {
			0% {
				transform: rotate(0deg);
				opacity: 1;
			}

			50% {
				transform: rotate(360deg);
				opacity: 1;
			}

			100% {
				transform: rotate(360deg);
				opacity: 0;
			}
		}
	</style>

	<style id="animation-shufflebox">
	</style>
</head>

<body>
	<div class="popup">
		<div class="popup-wrapper">
			<div class="popup-header">
				<img class="popup-icon" src="./pantherA.png" alt="tonk">
				<p>Do you love the Panzerkampfwagen V Panther Ausführung A tank?</p>
			</div>
			<div class="popup-text">
				<p>Now's the chance for you to buy one! Simply click on the link below, and follow the instructions to
					enter the auction for a chance to win your own Panther!</p>
			</div>
			<div class="popup-buttons">
				<button class="popup-button cancel" onclick="closePopup()">Don't Join Auction</button>
				<button class="popup-button" onclick="acceptPopup()">Join Auction</button>
			</div>
		</div>
	</div>

	<script>
		function acceptPopup() {
			document.body.classList.add('spinning');

			setTimeout(() => {
				window.parent.postMessage('closePopup', '*');
			}, 800);
		}

		function closePopup() {
			document.body.classList.add('closing');

			setTimeout(() => {
				window.parent.postMessage('closePopup', '*');
			}, 300);
		}
	</script>
</body>

</html>
