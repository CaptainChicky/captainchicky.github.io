<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'Open Sans', sans-serif;
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100vh;
			overflow: hidden;
		}

		.container {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 140px;
			height: 140px;
		}

		.icon-wrapper {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 140px;
			height: 140px;
		}

		.animated-icon {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 140px;
			height: 140px;
			border-radius: 50%;
			box-shadow: 0 0 3px 1px rgba(0, 0, 0, 0.25);
			user-select: none;
		}

		.icon-image {
			position: relative;
			z-index: 0;
			display: block;
			width: 100%;
			height: 100%;
			border-radius: 50%;
			cursor: pointer;
			opacity: 1;
			transition: opacity 0.25s ease-in;
			mask-image: radial-gradient(circle at center,
					black 40%,
					rgba(0, 0, 0, 0.3) 50%,
					rgba(0, 0, 0, 0.05) 56%,
					transparent 60%,
					transparent 100%);
			-webkit-mask-image: radial-gradient(circle at center,
					black 40%,
					rgba(0, 0, 0, 0.3) 50%,
					rgba(0, 0, 0, 0.05) 56%,
					transparent 60%,
					transparent 100%);
		}

		.close-button {
			position: absolute;
			top: 0;
			right: 0;
			z-index: 2;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 28px;
			height: 28px;
			border-radius: 50%;
			background-color: white;
			color: black;
			font-weight: 300;
			font-size: 24px;
			cursor: pointer;
			user-select: none;
			box-shadow: 0 0 3px 1px rgba(0, 0, 0, 0.25);
		}

		.progress-ring {
			position: absolute;
			width: 28px;
			height: 28px;
			border-radius: 50%;
			background-color: white;
		}

		.progress-clip {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			clip: rect(0, 14px, 28px, 0);
			width: 28px;
			height: 28px;
			border-radius: 50%;
		}

		.progress-fill {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			clip: rect(0, 28px, 28px, 14px);
			width: 28px;
			height: 28px;
			border-radius: 50%;
			background: black;
			transform: rotate(360deg);
		}

		.progress-inner {
			content: '';
			position: absolute;
			top: 2px;
			left: 2px;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 24px;
			height: 24px;
			border-radius: 50%;
			background: white;
			text-align: center;
		}

		.radio-waves-svg {
			position: absolute;
			width: 278px;
			z-index: 1;
			pointer-events: none;
		}

		/* Radio wave animations */
		#outer-waves {
			transform-origin: 50% 50%;
			animation: rotate-slow 10s infinite linear;
		}

		#inner-waves {
			transform-origin: 50% 50%;
			animation: rotate-fast 5s infinite linear;
		}

		@keyframes rotate-slow {
			to {
				transform: rotate(360deg);
			}
		}

		@keyframes rotate-fast {
			to {
				transform: rotate(360deg);
			}
		}

		/* Signal line animations */
		#signal-line-1,
		#signal-line-2,
		#signal-line-3 {
			opacity: 0;
			stroke-dasharray: 50;
			animation: pulse-signal 2s infinite;
		}

		#signal-line-3 {
			stroke-dasharray: 70;
		}

		@keyframes pulse-signal {
			to {
				opacity: 1;
				stroke-dashoffset: 400;
			}
		}

		/* Star animations */
		#star-1,
		#star-2,
		#star-3 {
			transform-origin: 50% 50%;
		}

		#star-1 {
			animation: twinkle 1.5s infinite;
		}

		#star-2 {
			animation: twinkle 3s infinite;
		}

		#star-3 {
			animation: twinkle 4s infinite;
		}

		@keyframes twinkle {
			0% {
				opacity: 0;
				transform: rotate(0deg);
			}

			50% {
				opacity: 1;
				transform: rotate(360deg);
			}

			100% {
				opacity: 0;
				transform: rotate(0deg);
			}
		}
	</style>
</head>

<body>
