		function redirect() {
			const input = document.getElementById('input').value;
			
			if (input === 'Based Cringe') {
				openInNewTab(createHumanPage());
			} else if (input === 'Based cringe') {
				alert('Bruh fix your "C" lmao');
			} else {
				openInNewTab(createBotPage());
			}
		}

		// Create the Human success page using DOM methods
		function createHumanPage() {
			const doc = document.implementation.createHTMLDocument('You are a human*');
			
			// Create styles
			const style = doc.createElement('style');
			style.textContent = `
				* {
					margin: 0;
					padding: 0;
					box-sizing: border-box;
				}

				body {
					font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
					min-height: 100vh;
					display: flex;
					align-items: center;
					justify-content: center;
					background: #1a1a2e;
					position: relative;
					overflow: hidden;
					padding: 20px;
				}

				body::before,
				body::after {
					content: '';
					position: absolute;
					border-radius: 50%;
					filter: blur(80px);
					opacity: 0.5;
					animation: float 20s ease-in-out infinite;
				}

				body::before {
					width: 400px;
					height: 400px;
					background: #00d4ff;
					top: -100px;
					left: -100px;
				}

				body::after {
					width: 500px;
					height: 500px;
					background: #ff006e;
					bottom: -150px;
					right: -150px;
					animation-delay: -10s;
				}

				@keyframes float {
					0%, 100% { transform: translate(0, 0) scale(1); }
					33% { transform: translate(50px, -50px) scale(1.1); }
					66% { transform: translate(-30px, 30px) scale(0.9); }
				}
				
				.container {
					background: white;
					padding: 50px 40px;
					border-radius: 12px;
					border: 3px solid #2ecc71;
					text-align: center;
					max-width: 600px;
					position: relative;
					overflow: hidden;
				}
				
				.container::before {
					content: '';
					position: absolute;
					top: 0;
					left: 0;
					right: 0;
					height: 8px;
					background: #2ecc71;
				}
				
				h1 {
					color: #2c3e50;
					font-size: 2.8em;
					margin-bottom: 20px;
					font-weight: 800;
					letter-spacing: -0.5px;
				}
				
				.checkmark {
					width: 80px;
					height: 80px;
					margin: 0 auto 30px;
					background: #2ecc71;
					border-radius: 50%;
					display: flex;
					align-items: center;
					justify-content: center;
					font-size: 3em;
					animation: pop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
				}
				
				@keyframes pop {
					0% {
						transform: scale(0);
					}
					100% {
						transform: scale(1);
					}
				}
				
				p {
					color: #7f8c8d;
					font-size: 1.05em;
					line-height: 1.6;
				}
				
				.asterisk {
					color: #e74c3c;
					font-weight: 700;
				}
			`;
			
			// Add meta viewport
			const meta = doc.createElement('meta');
			meta.name = 'viewport';
			meta.content = 'width=device-width, initial-scale=1.0';
			
			const metaCharset = doc.createElement('meta');
			metaCharset.setAttribute('charset', 'UTF-8');
			
			doc.head.appendChild(metaCharset);
			doc.head.appendChild(meta);
			doc.head.appendChild(style);
			
			// Create body content
			const container = doc.createElement('div');
			container.className = 'container';
			
			const checkmark = doc.createElement('div');
			checkmark.className = 'checkmark';
			checkmark.textContent = '✓';

			heading.textContent = 'You are a human';
			const asterisk = doc.createElement('span');
			asterisk.className = 'asterisk';
			asterisk.textContent = '*';
			heading.appendChild(asterisk);
			
			const paragraph = doc.createElement('p');
			const asterisk2 = doc.createElement('span');
			asterisk2.className = 'asterisk';
			asterisk2.textContent = '*';
			paragraph.appendChild(asterisk2);
			paragraph.appendChild(doc.createTextNode('or a bot who can complete captchas - in that case 😳 you are absolute pro'));

			container.appendChild(heading);
			container.appendChild(paragraph);
			doc.body.appendChild(container);
			
			return new XMLSerializer().serializeToString(doc);
		}

			const paragraph1 = doc.createElement('p');
			paragraph1.textContent = 'You failed the captcha so thus you are a bot whether you like it or not!';
			
			const paragraph2 = doc.createElement('p');
			paragraph2.className = 'small-text';
			paragraph2.textContent = 'Interesting that also rhymed';
			
			const binary = doc.createElement('div');
			binary.className = 'binary';
			binary.textContent = '01000010 01100101 01100101 01110000';
			
			container.appendChild(robotEmoji);
			container.appendChild(heading);
			container.appendChild(paragraph1);
			container.appendChild(paragraph2);
			container.appendChild(binary);
			doc.body.appendChild(container);
			
			return new XMLSerializer().serializeToString(doc);
		}

		// Open HTML content in a new tab with a clean URL
		function openInNewTab(htmlContent) {
			const blob = new Blob([htmlContent], { type: 'text/html' });
			const url = URL.createObjectURL(blob);
			const newWindow = window.open(url, '_blank');
			
			// Wait for the new window to load, then update its URL using History API
			if (newWindow) {
				newWindow.addEventListener('load', () => {
					try {
						// Replace the blob URL with the current page's URL
						newWindow.history.replaceState(null, '', window.location.href);
					} catch (e) {
						console.log('Could not update URL:', e);
					}
				});
			}
			
			// Clean up the blob URL after a delay
			setTimeout(() => URL.revokeObjectURL(url), 1000);
		}

		// Track number of submission attempts

			if (buttonClick === 4) {

				document.getElementById('buttonclickcount').innerHTML =
					"Uhm you submitted an entry like 5+ times already. What are you trying to do lol?";
			} else {
				buttonClick++;
			}
		}
