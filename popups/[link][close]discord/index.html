<!DOCTYPE html>
<html dir="ltr">

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		/* Reset and base styles */
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			-webkit-user-select: none;
			user-select: none;
		}

		body {
			padding: 0 8px;
			overflow: hidden;
			font-family: 'Open Sans', sans-serif;
			display: flex;
			flex-direction: column;
			align-items: flex-end;
			justify-content: center;
		}

		/* Animations */
		@keyframes slideInFromRight {
			from {
				transform: translateX(100%);
			}
			to {
				transform: translateX(0);
			}
		}

		@keyframes slideOutToRight {
			from {
				transform: translateX(0);
			}
			to {
				transform: translateX(150%);
			}
		}

		/* Notification card container */
		.notification-card {
			position: relative;
			display: flex;
			overflow: hidden;
			width: 100%;
			margin: 3px 0;
			padding: 6px;
			border-radius: 24px;
			background-color: #fafafa;
			box-shadow: 0 3px 3px -2px rgba(0, 0, 0, .2), 0 3px 4px 0 rgba(0, 0, 0, .14), 0 1px 4px 0 rgba(0, 0, 0, .12);
			visibility: hidden;
			user-select: none;
			transform: translateX(100%);
			animation: slideInFromRight 0.3s ease-in-out forwards;
		}

		/* Colored theme */
		.notification-card[contrast=colored] {
			background: transparent linear-gradient(90deg, #97eff6, #cca6ff) 0 0 no-repeat padding-box;
		}

		/* Default theme */
		.notification-card[contrast=default] {
			background-color: #e1e1e1;
		}

		/* Dark theme */
		.notification-card[contrast=dark] {
			background-color: #282c34;
			box-shadow: 0 3px 3px -2px hsla(0, 0%, 86.3%, .2), 0 3px 4px 0 hsla(0, 0%, 86.3%, .14), 0 1px 4px 0 hsla(0, 0%, 86.3%, .12);
		}

		/* Visible state */
		.notification-card.visible {
			visibility: visible;
			transition: transform .3s ease-in;
			transform: translateX(0);
		}

		/* Icon container */
		.icon-container {
			position: relative;
			flex: 0 0 18%;
			width: 18%;
			height: 0;
			padding-top: 18%;
		}

		/* Icon image */
		.icon-image {
			position: absolute;
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			object-fit: cover;
			width: 100%;
			height: 100%;
			border-radius: 2px;
		}

		/* Content wrapper */
		.content-wrapper {
			width: 100%;
		}

		/* Text content */
		.text-content {
			display: flex;
			flex-grow: 1;
			flex-direction: column;
			justify-content: center;
			overflow: hidden;
			margin: 0 4px 0 6px;
		}

		html[dir=rtl] .text-content {
			margin: 0 6px 0 4px;
		}

		.text-content>div {
			color: #222;
		}

		.notification-card[contrast=dark] .text-content>div {
			color: #fff;
		}

		/* Title text */
		.title-text {
			font-size: 14px;
			line-height: 1.5;
		}

		.title-text.large {
			font-weight: 700;
			font-size: 15px;
		}

		/* Subtitle text */
		.subtitle-text {
			font-size: 12px;
			line-height: 1.2;
		}

		.subtitle-text.medium {
			font-size: 13px;
		}

		.notification-card:not([contrast=dark]) .subtitle-text {
			color: #686868;
		}

		/* Top row with icon and text */
		.top-row {
			display: flex;
			padding: 5px;
		}

		/* Button container */
		.button-container {
			display: flex;
			justify-content: space-between;
			margin-top: 5px;
		}

		/* Button styles */
		.button {
			width: 49%;
			padding: 7px;
			cursor: pointer;
			font: inherit;
			border-radius: 10px;
			font-weight: 700;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.button.primary {
			background-color: #2172e7;
			color: #fff;
		}

		.button.secondary {
			background-color: #fff;
			color: #2172e7;
		}

		.notification-card[contrast=dark] .button.secondary,
		.notification-card[contrast=light] .button.secondary {
			background-color: #e1e1e1;
		}

		.notification-card[contrast=colored] .button.secondary.active,
		.notification-card[contrast=dark] .button.secondary.active,
		.notification-card[contrast=default] .button.secondary.active,
		.notification-card[contrast=light] .button.secondary.active {
			background-color: #2172e7;
			color: #fff;
		}

		.notification-card[contrast] .button-container>div:nth-child(2) {
			border: 2px solid #666;
			background-color: transparent;
			color: #666;
		}

		/* Custom overrides */
		body {
			padding: 4px 12px;
		}

		.notification-card {
			margin-bottom: 10px !important;
		}

		.subtitle-text {
			color: #f9f6f6 !important;
		}

		.button.primary {
			color: #fbf8f8 !important;
			background-color: #009688 !important;
		}

		.notification-card {
			background-color: #e91e63 !important;
			box-shadow: 0px 3px 10px 4px rgba(233, 30, 99, 0.71) !important;
		}

		.button.secondary {
			border: 2px dotted #009688 !important;
			color: #fffdfd !important;
		}

		.title-text {
			color: #fffefe !important;
		}
	</style>
</head>

<body class="notranslate">
	<div class="notification-card visible" data-role="on-page" contrast="light" id="firstNotif">
		<div class="content-wrapper">
			<div class="top-row">
				<div class="icon-container" data-role="icon-container">
					<img class="icon-image" src="./discord-logo.png" alt="Discord logo">
				</div>
				<div class="text-content">
					<div class="title-text large"></div>
					<div style="font-size:120%; padding-left:2rem !important" class="subtitle-text medium">
						All-in-one digital platform with high growth potential in multiple niches
					</div>
					<br>
					<div class="button-container" contrast="light">
						<div class="button primary" id="discord">
							<!-- span wrapper to not fuck up the flexbox -->
							<span style="text-align: center">
								Visit https://discor<span style="letter-spacing: -2px !important">c</span>l.com today!
							</span>
						</div>
						<div class="button secondary" id="closediscord">×</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="notification-card visible" data-role="on-page" contrast="light" id="secondNotif">
		<div class="content-wrapper">
			<div class="top-row">
				<div class="icon-container" data-role="icon-container">
					<img class="icon-image" src="./discord-nitro.png" alt="Discord Nitro">
				</div>
				<div class="text-content">
					<div class="title-text large"></div>
					<div style="font-size:120%; padding-left:2rem !important" class="subtitle-text medium">
						You just got 3 months of <b>FREE</b> Discord Nitro!
					</div>
					<br>
					<div class="button-container" contrast="light">
						<div class="button primary" id="nitro">Claim here</div>
						<div class="button secondary" id="closenitro">×</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		let counter = 0;

		function handleClick(containerId, url) {
			counter++;
			const container = document.getElementById(containerId);
			container.style.animation = 'slideOutToRight 0.3s ease-in-out forwards';
			setTimeout(() => {
				if (url) {  // Only open if URL exists
					window.open(url, '_blank');
				}
				if (counter >= 2) {
					setTimeout(() => {
						window.parent.postMessage('closePopup', '*');
					}, 3000)
				}
			}, 300);
		}

		document.getElementById('discord').addEventListener('click', () => 
			handleClick('firstNotif', '/Archive/Surprise!!!/')
		);
		document.getElementById('closediscord').addEventListener('click', () => 
			handleClick('firstNotif', null)
		);
		document.getElementById('nitro').addEventListener('click', () => 
			handleClick('secondNotif', '/Archive/Surprise!!!/')
		);
		document.getElementById('closenitro').addEventListener('click', () => 
			handleClick('secondNotif', null)
		);
	</script>
</body>

</html>
