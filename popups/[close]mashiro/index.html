<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: medium-content-sans-serif-font, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, Montserrat, "Open Sans", "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
		}

		/* Animation */
		@keyframes bottomCenter {
			from {
				transform: translateY(100vh);
			}
			to {
				transform: translateY(0);
			}
		}

		@keyframes slideDown {
			from {
				transform: translateY(0);
			}
			to {
				transform: translateY(100vh);
			}
		}

		/* Notification Container */
		.notification-container {
			position: fixed;
			bottom: 0;
			left: calc(50% - 195px); /* half of notification-wrapper width */
			transform: translateX(-50%);
			z-index: 2147483647;
			animation: bottomCenter 0.3s ease-in-out forwards;
			cursor: pointer;
		}

		.notification-wrapper {
			margin: 2px;
			width: 390px;
		}

		/* Notification Card */
		.notification-card {
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: row-reverse;
			position: relative;
			min-height: 90px;
			width: 98%;
			overflow: visible;
			border-radius: 10px;
			text-decoration: none;
		}

		/* Avatar Section */
		.avatar-container {
			position: relative;
		}

		.notification-badge {
			position: absolute;
			top: 10px;
			left: 10px;
			width: 18px;
			height: 18px;
			background-color: red;
			border-radius: 50%;
			font-family: 'Times New Roman', Times, serif;
			font-size: 16px;
			display: flex;
			align-items: center;
			justify-content: center;
			padding-bottom: 2px;
			padding-left: 1px;
		}

		.notification-badge span {
			color: white;
		}

		.avatar-image {
			width: 70px;
			height: 70px;
			margin: 10px 10px 10px 10px;
			padding: 5px;
			border-radius: 50%;
			box-shadow: 1px 3px 9px 2px rgb(255 152 44);
		}

		/* Message Content */
		.message-container {
			position: relative;
			margin-left: 5px;
			padding: 5px;
			width: 260px;
			min-height: 48px;
			background: #443e3e;
			border-radius: 10px;
			box-shadow: 0px 0px 8px 3px rgb(255 152 44), 2px 2px 5px 0px rgba(0, 0, 0, 0.75);
			color: white;
			font-size: 12px;
			line-height: 1.4;
			text-align: left;
		}

		.message-sender {
			margin: 0 auto 0;
			padding: 0 10px;
			max-height: 16px;
			width: fit-content;
			background: #ff982c;
			border-radius: 2px;
			color: black;
			font-weight: bold;
			line-height: 16px;
			overflow: hidden;
		}

		.message-text {
			margin: 0;
			line-height: 16px;
			font-weight: bolder;
			text-align: center;
			overflow: hidden;
			word-wrap: break-word;
		}

		/* Close Button */
		.close-button {
			position: absolute;
			top: -2px;
			right: 2px;
			width: 36px;
			height: 36px;
			padding: 0;
			background-color: #ff982c;
			background-clip: padding-box;
			border: 8px solid rgba(0, 0, 0, 0);
			border-radius: 50%;
			cursor: pointer;
			z-index: 2147483647;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.close-icon {
			width: 10px;
			height: 10px;
			background-image: url(./close.svg);
			background-repeat: no-repeat;
			background-size: contain;
			cursor: pointer;
			pointer-events: none;
		}

		/* Utility class for hiding */
		.hidden {
			display: none !important;
		}
	</style>
</head>

<body>
	<div id="notificationPopup" class="notification-container">
		<div class="notification-wrapper">
			<div class="notification-card">
				<!-- Avatar Section -->
				<div class="avatar-container" id="pfp">
					<span class="notification-badge"><span>1</span></span>
					<img class="avatar-image" src="./Mashiro.png" alt="Mashiro avatar">
				</div>

				<!-- Message Content -->
				<div class="message-container" id="content">
					<p class="message-sender">Mashiro</p>
					<p class="message-text">
						Are you a lamp because I am attracted 💡
					</p>
				</div>

				<!-- Close Button -->
				<div class="close-button" id="close">
					<div class="close-icon"></div>
				</div>
			</div>
		</div>
	</div>

	<script>
		document.getElementById('content').addEventListener('click', function() {
			// Navigate to the link in a new tab
			window.open('https://nhentai.net/g/424380/', '_blank');
			
			// After 3 seconds, tell parent to close popup
			setTimeout(() => {
				window.parent.postMessage('closePopup', '*');
			}, 1000);
		});

		document.getElementById('pfp').addEventListener('click', function() {
			// Navigate to the link in a new tab
			window.open('https://nhentai.net/g/424380/', '_blank');
			
			// After 3 seconds, tell parent to close popup
			setTimeout(() => {
				window.parent.postMessage('closePopup', '*');
			}, 1000);
		});

		document.getElementById('close').addEventListener('click', function() {
			const container = document.querySelector('.notification-container');
			
			// Add closing animation
			container.style.animation = 'slideDown 0.3s ease-in-out forwards';
			
			// Wait for animation to finish, then close
			setTimeout(() => {
				window.parent.postMessage('closePopup', '*');
			}, 300);
		});
	</script>
</body>

</html>
