<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!-- fonts -->
	<style>
		@font-face {
			font-family: 'Roboto';
			font-style: normal;
			font-weight: 400;
			font-stretch: 100%;
			src: url(./roboto400.woff2) format('woff2');
			unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
		}

		@font-face {
			font-family: 'Roboto';
			font-style: normal;
			font-weight: 700;
			font-stretch: 100%;
			src: url(./roboto700.woff2) format('woff2');
			unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
		}
	</style>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			position: relative;
		}

		html,
		body {
			width: 100%;
			height: 100%;
		}

		html {
			font-size: 14px;
			overflow: hidden;
		}

		body {
			font-family: "Roboto", sans-serif;
			background: transparent;
			color: #212121;
			user-select: none;
			cursor: default;
			display: flex;
			align-items: flex-start;
			justify-content: flex-start;
		}

		.banner {
			width: 100%;
			max-width: 400px;
			height: 100%;
			max-height: 110px;
			border-radius: 12px;
		}

		.banner-wrapper {
			background: #ffffff;
			width: 100%;
			height: 100%;
			border-radius: 12px;
			box-shadow: 0 3px 10px -3px rgba(0, 0, 0, 0.2);
			display: flex;
			align-items: stretch;
			justify-content: space-between;
			overflow: hidden;
			transform: translateX(-150%);
			animation: slideIn 0.2s ease-out 0.3s forwards;
		}

		.banner-wrapper.closing {
			animation: slideOut 0.3s ease-in forwards;
		}

		.banner-wrapper.spinning {
			animation: spinAndSlideOut 0.8s ease-in-out forwards;
		}

		@keyframes slideIn {
			100% {
				transform: translateX(0);
			}
		}

		@keyframes slideOut {
			0% {
				transform: translateX(0);
			}

			100% {
				transform: translateX(-150%);
			}
		}

		@keyframes spinAndSlideOut {
			0% {
				transform: translateX(0) rotate(0deg);
			}

			50% {
				transform: translateX(0) rotate(360deg);
			}

			100% {
				transform: translateX(-150%) rotate(360deg);
			}
		}

		.banner-content {
			flex: 1;
			padding: 6px;
			display: flex;
			align-items: center;
			justify-content: flex-start;
		}

		.banner-icon {
			width: 70px;
			height: 70px;
			object-fit: contain;
			margin-right: 10px;
		}

		.banner-text h1 {
			font-size: 1.1rem;
			font-weight: 400;
			margin-bottom: 4px;
		}

		.banner-text p {
			display: -webkit-box;
			-webkit-box-orient: vertical;
			-webkit-line-clamp: 2;
			line-clamp: 2;
			max-height: 34px;
			overflow: hidden;
			text-overflow: ellipsis;
			line-height: 1.2rem;
		}

		.banner-actions {
			border-left: 1px solid #e0e0e0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: space-between;
		}

		.banner-button {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 50%;
			width: 100%;
			text-transform: uppercase;
			color: #717171;
			font-size: 0.9rem;
			padding: 5px 10px;
			cursor: pointer;
		}

		.banner-button:first-child {
			border-bottom: 1px solid #e0e0e0;
		}

		.banner-button:hover {
			background: #f7f7f7;
		}
	</style>

	<style id="animation-shufflebox">
		body {
			animation: slideFromLeftTop 1.6s forwards ease-out;
		}

		@keyframes slideFromLeftTop {
			0% {
				transform: translate(-100%, -100%);
			}

			100% {
				transform: translate(0, 0);
			}
		}
	</style>

	<style id="invert-style">
		body,
		img,
		video {
			filter: invert(1) hue-rotate(180deg);
		}
	</style>
</head>

<body>
	<div class="banner">
		<div class="banner-wrapper">
			<div class="banner-content">
				<img class="banner-icon" src="./freakyabi.gif" alt="freaky miyabi">
				<div class="banner-text">
					<h1><b>She Wants to Get Freaky</b></h1>
					<p>Just for today! Go with her now!</p>
				</div>
			</div>
			<div class="banner-actions">
				<div class="banner-button" onclick="closePopup()">
					<p>Cancel</p>
				</div>
				<div class="banner-button" onclick="acceptPopup()">
					<p>Join</p>
				</div>
			</div>
		</div>
	</div>

	<script>
		function acceptPopup() {
			const wrapper = document.querySelector('.banner-wrapper');
			wrapper.classList.add('spinning');

			setTimeout(() => {
				window.open('https://twitter.com/the_freakin_yui/status/1873659817832910970', '_blank');
			}, 500);

			// Wait for animation to complete before closing
			setTimeout(() => {
				window.parent.postMessage('closePopup', '*');
			}, 3000);
		}

		function closePopup() {
			const wrapper = document.querySelector('.banner-wrapper');
			wrapper.classList.add('closing');

			// Wait for animation to complete before closing
			setTimeout(() => {
				window.parent.postMessage('closePopup', '*');
			}, 3000);
		}
	</script>
</body>

</html>
