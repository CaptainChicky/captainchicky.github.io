<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Manager Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px;
        }

        .demo-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #667eea;
            color: white;
            transition: all 0.3s;
            font-weight: 600;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button.danger {
            background: #e74c3c;
        }

        button.danger:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>Popup Manager Demo</h1>

        <p>Popups with no buttons (mainly circular rings) that hyperlink when clicked on in general area.</p>
        <div class="button-group">
            <button onclick="noButtonNotifAshley()">show ashley notif (no buttons)</button>
            <button onclick="noButtonNotifBadDragon()">show bad dragon notif (no buttons)</button>
            <button onclick="noButtonNotifJuniper()">show juniper notif (no buttons)</button>
            <button class="danger" onclick="closeAll()">Close All Popups</button>
        </div>

        <p>Popups with only close button, and hyperlink when clicked on elsewhere.</p>
        <div class="button-group">
            <button onclick="closeNotifBCell()">show b cell notif (close)</button>
            <button class="danger" onclick="closeAll()">Close All Popups</button>
        </div>
    </div>

    <!-- Include the popup manager -->
    <script src="/popups/popupmanager.js"></script>

    <script>
        function noButtonNotifAshley() {
            popupManager.show('/popups/ashley/', {
                clickSelector: '.wrapper',
                duration: 60000 // Auto-close after 1 min
            });
        }

        function noButtonNotifBadDragon() {
            popupManager.show('/popups/baddragon/', {
                clickSelector: '.notification-wrapper',
                duration: 60000 // Auto-close after 1 min
            });
        }

        function noButtonNotifJuniper() {
            popupManager.show('/popups/juniper/', {
                clickSelector: '.container',
                duration: 60000 // Auto-close after 1 min
            });
        }

        function closeNotifBCell() {
            popupManager.show('/popups/[close]BCell/', {
                clickSelector: '.notification-container'
            });
        }

        function closeAll() {
            popupManager.closeAll();
        }
    </script>
</body>
</html>
