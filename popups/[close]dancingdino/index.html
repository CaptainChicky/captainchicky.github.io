<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			overflow: hidden;
		}

		.video-container {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: 100%;
			background: #242323a1;
		}

		.video-container video {
			width: 100vw;
			height: 100dvh;
			object-fit: contain;
		}

		.close-button {
			position: absolute;
			top: 0;
			right: 0;
			z-index: 10;
			padding: 0;
			border: none;
			background: none;
			color: #fff;
			outline: none;
			cursor: pointer;
			transition: opacity 0.25s;
			background-color: buttonface;
			opacity: 0.5;
			height: 27px;
		}

		.close-button img {
			width: 27px;
			height: 27px;
		}

		.close-button:hover {
			opacity: 1;
		}

		.volume-button {
			position: absolute;
			top: 0;
			left: 0;
			z-index: 10;
			padding: 5px 8px;
			border: none;
			outline: none;
			opacity: 0.5;
			cursor: pointer;
			background-color: buttonface;
		}

		.volume-button:hover {
			opacity: 1;
		}

		.volume-button img {
			width: 16px;
			height: 17px;
		}

		.hidden {
			opacity: 0;
			pointer-events: none;
		}

		.visible {
			opacity: 1;
			pointer-events: all;
		}
	</style>
</head>

<body>
	<div class="video-container">
		<button class="close-button visible" onclick="closeVideo()">
			<img src="./close.png" alt="close">
		</button>
		<button class="volume-button" onclick="toggleMute(event)">
			<img src="./volume.png" alt="volume" id="volumeIcon">
		</button>
		<video id="video" loop autoplay playsinline muted>
			<source src="./dancingdino.mp4" type="video/mp4">
			<p>Your browser is too shitty, fix this.</p>
		</video>
		<audio id="audio" loop autoplay muted>
			<source src="./rasputin.opus" type="audio/ogg; codecs=opus">
		</audio>
	</div>

	<script>
		const video = document.getElementById('video');
		const audio = document.getElementById('audio');
		const volumeIcon = document.getElementById('volumeIcon');

		function closeVideo() {
			// Pause and reset both video and audio
			video.pause();
			video.currentTime = 0;
			video.muted = true;

			audio.pause();
			audio.currentTime = 0;
			audio.muted = true;

			document.body.style.display = 'none';
		}

		function toggleMute(event) {
			event.stopPropagation();
			const shouldMute = !video.muted;
			video.muted = shouldMute;
			audio.muted = shouldMute;
		}

		// Unmute on any click anywhere on the page
		document.addEventListener('click', function () {
			if (video.muted || audio.muted) {
				video.muted = false;
				audio.muted = false;
			}
		});
	</script>
</body>

</html>
