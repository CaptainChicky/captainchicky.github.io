<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>SVG Path Editor</title>
	<style>
		body {
			margin: 0;
			background: #111;
			color: #ddd;
			font-family: monospace;
			display: grid;
			grid-template-columns: 1fr 1fr;
			height: 100vh;
		}

		textarea {
			background: #0d0d0d;
			color: #9cdcfe;
			border: none;
			padding: 16px;
			font-size: 14px;
			resize: none;
			outline: none;
		}

		svg {
			background: #222;
			width: 100%;
			height: 100%;
		}

		.panel {
			display: flex;
			flex-direction: column;
		}

		.label {
			padding: 8px 16px;
			background: #000;
			font-size: 12px;
			color: #aaa;
			border-bottom: 1px solid #333;
		}

		#pathInput {
			flex: 1;
		}
	</style>
</head>

<body>

	<div class="panel">
		<div class="label">SVG Coords (edit this)</div>
		<textarea id="pathInput">
M 300,60
C 350,55 400,60 440,75
C 480,90 510,105 540,120
C 560,130 575,135 585,137
C 590,138 590,138 590,138
C 585,139 575,141 560,146
C 540,156 510,171 480,186
C 440,201 400,216 350,221
C 300,216 250,221 220,216
C 180,201 140,186 100,171
C 80,156 60,146 45,141
C 30,139 30,138 30,138
C 30,138 30,138 35,137
C 45,135 60,130 80,120
C 110,105 140,90 180,75
C 220,60 250,55 300,60
Z
  		</textarea>
	</div>

	<div class="panel">
		<div class="label">Live Preview</div>
		<svg viewBox="0 0 600 300">
			<path id="eyePath" fill="#88c0ff" stroke="white" stroke-width="2" />
		</svg>
	</div>

	<script>
		const input = document.getElementById("pathInput");
		const path = document.getElementById("eyePath");

		function update() {
			path.setAttribute("d", input.value);
		}

		input.addEventListener("input", update);
		update();
	</script>

</body>

</html>
