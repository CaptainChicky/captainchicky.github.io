<!DOCTYPE html>
<html>

<head>
	<style>
		* {
			margin: 0;
			padding: 0;
		}

		body {
			background: #000;
			overflow: hidden;
		}

		canvas {
			display: block;
			cursor: pointer;
		}

		#info {
			position: fixed;
			bottom: 12px;
			right: 12px;
			color: #fff;
			font: 13px monospace;
			background: rgba(0, 0, 0, 0.5);
			padding: 6px 10px;
			border-radius: 6px;
			pointer-events: none;
			z-index: 1;
		}
	</style>
</head>

<body>
	<canvas id="c"></canvas>
	<div id="info">click to regenerate</div>
	<script>
		const c = document.getElementById('c');
		const ctx = c.getContext('2d');

		const P = new Uint8Array(512);
		function seed() { for (let i = 0; i < 256; i++) P[i] = P[i + 256] = Math.random() * 256 | 0; }
		function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
		function lerp(a, b, t) { return a + (b - a) * t; }
		function grad(h, x, y) { const a = h & 3; return a === 0 ? x + y : a === 1 ? -x + y : a === 2 ? x - y : -x - y; }
		function noise(x, y) {
			const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, xf = x - Math.floor(x), yf = y - Math.floor(y);
			const u = fade(xf), v = fade(yf);
			return lerp(lerp(grad(P[P[X] + Y], xf, yf), grad(P[P[X + 1] + Y], xf - 1, yf), u),
				lerp(grad(P[P[X] + Y + 1], xf, yf - 1), grad(P[P[X + 1] + Y + 1], xf - 1, yf - 1), u), v);
		}
		function fbm(x, y, n) {
			let v = 0, a = 0.5, f = 1;
			for (let i = 0; i < n; i++) { v += a * noise(x * f, y * f); a *= 0.5; f *= 2; }
			return v;
		}

		function hsl2rgb(h, s, l) {
			h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
			const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
			const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
			return [f(0) * 255 | 0, f(8) * 255 | 0, f(4) * 255 | 0];
		}

		function genPalette() {
			const hue = Math.random() * 360, spread = 20 + Math.random() * 40, sat = 40 + Math.random() * 40;
			const pal = [], n = 8 + (Math.random() * 5 | 0);
			for (let i = 0; i < n; i++) {
				const t = i / (n - 1);
				const h = hue + Math.sin(t * Math.PI * 2) * spread + (Math.random() - 0.5) * 15;
				const s = sat + Math.sin(t * Math.PI) * 20 + (Math.random() - 0.5) * 10;
				const l = 8 + t * 75 + (Math.random() - 0.5) * 12;
				pal.push(hsl2rgb(h, Math.max(10, Math.min(95, s)), Math.max(5, Math.min(92, l))));
			}
			if (Math.random() > 0.4) { const a = Math.random() * n | 0, b = Math.random() * n | 0; const t = pal[a]; pal[a] = pal[b]; pal[b] = t; }
			return pal;
		}

		function colorAt(t, pal) {
			t = ((t % 1) + 1) % 1;
			const idx = t * (pal.length - 1), i = idx | 0, f = idx - i;
			const a = pal[i], b = pal[Math.min(i + 1, pal.length - 1)];
			return [lerp(a[0], b[0], f) | 0, lerp(a[1], b[1], f) | 0, lerp(a[2], b[2], f) | 0];
		}

		let job = null;

		function generate() {
			if (job) { cancelAnimationFrame(job); job = null; }
			const W = c.width, H = c.height;
			seed();
			const pal = genPalette();
			const sc = 2.5 + Math.random() * 2, w1 = 1.5 + Math.random() * 2.5, w2 = 0.8 + Math.random() * 1.2;
			const bands = 4 + Math.random() * 8, oxx = Math.random() * 100, oyy = Math.random() * 100;
			const cxx = 0.3 + Math.random() * 0.4, cyy = 0.3 + Math.random() * 0.4, sq = 0.5 + Math.random();
			const dim = Math.min(W, H);
			const ROWS = 8; // rows per frame
			let row = 0;

			ctx.setTransform(1, 0, 0, 1, 0, 0);
			ctx.fillStyle = '#000';
			ctx.fillRect(0, 0, W, H);

			function renderChunk() {
				const end = Math.min(row + ROWS, H);
				const img = ctx.createImageData(W, end - row);
				const d = img.data;
				let p = 0;
				for (let y = row; y < end; y++) {
					for (let x = 0; x < W; x++) {
						let nx = (x - W * cxx) / dim * sc, ny = (y - H * cyy) / dim * sc * sq;
						const ax = fbm(nx + oxx, ny + oyy, 3) * w1, ay = fbm(nx + oxx + 5.2, ny + oyy + 1.3, 3) * w1;
						const bx = fbm(nx + ax + 1.7, ny + ay + 9.2, 3) * w2, by = fbm(nx + ax + 8.3, ny + ay + 2.8, 3) * w2;
						let v = fbm(nx + bx, ny + by, 3);
						const dist = Math.sqrt(nx * nx + ny * ny);
						v = v * 0.6 + (dist * 0.5 + fbm(nx * 0.8 + oxx, ny * 0.8 + oyy, 2) * 0.8) * 0.4;
						v *= bands;
						const band = v - Math.floor(v);
						const sharp = band < 0.1 ? band * 5 : band > 0.9 ? (1 - band) * 5 + 0.5 : 0.5 + (band - 0.5) * 0.3;
						const t = (v / bands + sharp * 0.15 + 0.5) % 1;
						const col = colorAt(t, pal);
						const edge = Math.min(band, 1 - band);
						const vein = edge < 0.03 ? 0.4 + edge * 20 : 1;
						d[p++] = col[0] * vein | 0; d[p++] = col[1] * vein | 0; d[p++] = col[2] * vein | 0; d[p++] = 255;
					}
				}
				ctx.putImageData(img, 0, row);
				row = end;
				if (row < H) {
					job = requestAnimationFrame(renderChunk);
				} else {
					// vignette
					const g = ctx.createRadialGradient(W / 2, H / 2, dim * 0.2, W / 2, H / 2, dim * 0.75);
					g.addColorStop(0, 'transparent');
					g.addColorStop(1, 'rgba(0,0,0,0.5)');
					ctx.fillStyle = g;
					ctx.fillRect(0, 0, W, H);
					job = null;
				}
			}
			job = requestAnimationFrame(renderChunk);
		}

		function resize() {
			c.width = window.innerWidth;
			c.height = window.innerHeight;
			generate();
		}

		resize();
		window.addEventListener('resize', resize);
		c.addEventListener('click', generate);
	</script>
</body>

</html>
