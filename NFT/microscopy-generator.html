<!DOCTYPE html>
<html>

<head>
	<style>
		* {
			margin: 0;
			padding: 0;
		}

		body {
			background: #000;
			overflow: hidden;
		}

		canvas {
			display: block;
			cursor: pointer;
		}

		#info {
			position: fixed;
			bottom: 12px;
			right: 12px;
			color: #7ac;
			font: 13px monospace;
			background: rgba(0, 10, 20, 0.7);
			padding: 6px 10px;
			border-radius: 6px;
			pointer-events: none;
			z-index: 1;
		}
	</style>
</head>

<body>
	<canvas id="c"></canvas>
	<div id="info">click for new specimen</div>
	<script>
		const c = document.getElementById('c'), ctx = c.getContext('2d');
		function rr(a, b) { return a + Math.random() * (b - a); }
		function ri(a, b) { return a + Math.random() * (b - a) | 0; }
		function pick(a) { return a[Math.random() * a.length | 0]; }
		function hsl(h, s, l, a) { return `hsla(${((h % 360) + 360) % 360},${s}%,${l}%,${a ?? 1})`; }
		function glow(x, y, r, h, s, l, a) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, hsl(h, s, l, a)); g.addColorStop(0.4, hsl(h, s, l * 0.7, a * 0.4)); g.addColorStop(1, 'transparent'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }

		// universal wobbly shape
		function wob(cx, cy, r, amt, seed) {
			amt = amt || 0.12; seed = seed || rr(0, 100);
			ctx.beginPath();
			for (let i = 0; i <= 32; i++) {
				const a = i / 32 * Math.PI * 2;
				const w = 1 + Math.sin(a * 3.7 + seed) * amt * 0.6 + Math.sin(a * 5.3 + seed * 1.7) * amt * 0.4 + Math.sin(a * 2.1 + seed * 0.5) * amt * 0.3;
				ctx.lineTo(cx + Math.cos(a) * r * w, cy + Math.sin(a) * r * w);
			}
			ctx.closePath();
		}
		function wobEllipse(cx, cy, rx, ry, rot, amt, seed) {
			amt = amt || 0.1; seed = seed || rr(0, 100);
			ctx.beginPath();
			const c2 = Math.cos(rot || 0), s2 = Math.sin(rot || 0);
			for (let i = 0; i <= 40; i++) {
				const a = i / 40 * Math.PI * 2;
				const w = 1 + Math.sin(a * 3.3 + seed) * amt * 0.5 + Math.sin(a * 5.7 + seed * 2) * amt * 0.4;
				const px = Math.cos(a) * rx * w, py = Math.sin(a) * ry * w;
				ctx.lineTo(cx + px * c2 - py * s2, cy + px * s2 + py * c2);
			}
			ctx.closePath();
		}

		// === PARAMECIUM ===
		function drawParamecium(x, y, sz, hue) {
			ctx.save(); ctx.translate(x, y); ctx.rotate(rr(0, Math.PI * 2));
			const len = sz * rr(2, 2.8), w = sz * rr(0.55, 0.7);
			const variant = ri(0, 3);
			const asymL = rr(0.95, 1.08), asymR = rr(0.95, 1.08);
			const oralDepth = rr(0.15, 0.28), oralPos = rr(1.5, 1.7);
			const postTaper = rr(0.1, 0.2);
			ctx.save(); ctx.globalCompositeOperation = 'screen'; glow(0, 0, len * 0.7, hue, 70, 50, 0.15); ctx.restore();
			const divOff = variant === 2 ? len * 0.08 : 0;
			for (const half of variant === 2 ? [-1, 1] : [0]) {
				ctx.save(); ctx.translate(half * divOff, 0);
				if (variant === 2 && half === 1) ctx.scale(0.9, 0.95);
				const slipR = (a) => {
					const post = Math.exp(-Math.pow((a - Math.PI) / 0.5, 2)) * postTaper;
					const oral = Math.exp(-Math.pow((a - Math.PI * oralPos) / 0.3, 2)) * oralDepth;
					const ant = Math.exp(-Math.pow(a / 0.6, 2)) * 0.05 + Math.exp(-Math.pow((a - Math.PI * 2) / 0.6, 2)) * 0.05;
					const asym = a > Math.PI ? asymL : asymR;
					return { rx: (1 - post + ant) * asym + rr(-0.015, 0.015), ry: (1 - oral) * asym + rr(-0.015, 0.015) };
				};
				ctx.beginPath();
				for (let i = 0; i <= 80; i++) { const a = i / 80 * Math.PI * 2; const m = slipR(a); ctx.lineTo(Math.cos(a) * len / 2 * m.rx, Math.sin(a) * w / 2 * m.ry); }
				ctx.closePath();
				const bg = ctx.createRadialGradient(-len * 0.05, 0, 0, 0, 0, len * 0.55);
				bg.addColorStop(0, hsl(hue, 65, 60, 0.35)); bg.addColorStop(0.4, hsl(hue, 55, 50, 0.25)); bg.addColorStop(1, hsl(hue, 45, 35, 0.08));
				ctx.fillStyle = bg; ctx.fill(); ctx.strokeStyle = hsl(hue, 70, 58, 0.55); ctx.lineWidth = 1.3; ctx.stroke();
				// pellicle
				ctx.strokeStyle = hsl(hue, 50, 55, 0.08); ctx.lineWidth = 0.3;
				for (let i = -6; i <= 6; i++) { ctx.beginPath(); ctx.moveTo(-len * 0.4, i * w * 0.07); ctx.quadraticCurveTo(0, i * w * 0.07 + w * rr(0.1, 0.18), len * 0.4, i * w * 0.07); ctx.stroke(); }
				// oral groove
				ctx.beginPath(); ctx.moveTo(len * rr(0.1, 0.18), w * rr(0.3, 0.38)); ctx.quadraticCurveTo(0, w * rr(0.1, 0.18), -len * rr(0.12, 0.18), w * rr(0.05, 0.12));
				ctx.strokeStyle = hsl(hue + 10, 55, 48, 0.35); ctx.lineWidth = 1; ctx.stroke();
				// macronucleus
				wobEllipse(len * rr(0, 0.06), -w * rr(-0.03, 0.05), len * rr(0.11, 0.16), w * rr(0.12, 0.18), rr(-0.3, 0.3), 0.08);
				const ng = ctx.createRadialGradient(len * 0.03, -w * 0.02, 0, len * 0.03, -w * 0.02, len * 0.12);
				ng.addColorStop(0, hsl(hue + 35, 75, 60, 0.5)); ng.addColorStop(1, hsl(hue + 35, 60, 45, 0.15));
				ctx.fillStyle = ng; ctx.fill(); ctx.strokeStyle = hsl(hue + 35, 65, 52, 0.35); ctx.lineWidth = 0.8; ctx.stroke();
				// micronucleus
				wob(len * rr(0.08, 0.15), -w * rr(0, 0.08), sz * rr(0.025, 0.04), 0.15);
				ctx.fillStyle = hsl(hue + 50, 80, 55, 0.55); ctx.fill();
				// bursaria algae
				if (variant === 1) { for (let i = 0; i < ri(15, 30); i++) { const ax = rr(-len * 0.35, len * 0.3), ay = rr(-w * 0.3, w * 0.3); wob(ax, ay, sz * rr(0.01, 0.022), 0.2); ctx.fillStyle = hsl(120, 70, 45, rr(0.2, 0.45)); ctx.fill(); } }
				// contractile vacuoles
				for (const vx of [-len * rr(0.25, 0.35), len * rr(0.2, 0.3)]) {
					wob(vx, rr(-w * 0.05, w * 0.05), sz * rr(0.03, 0.05), 0.18);
					ctx.strokeStyle = hsl(hue - 10, 50, 60, 0.3); ctx.lineWidth = 0.7; ctx.stroke();
					for (let j = 0; j < ri(4, 7); j++) { const a = j / 6 * Math.PI * 2 + rr(-0.2, 0.2); ctx.beginPath(); ctx.moveTo(vx + Math.cos(a) * sz * 0.04, Math.sin(a) * sz * 0.04); ctx.lineTo(vx + Math.cos(a) * sz * rr(0.06, 0.1), Math.sin(a) * sz * rr(0.06, 0.1)); ctx.strokeStyle = hsl(hue - 10, 40, 55, 0.15); ctx.lineWidth = 0.3; ctx.stroke(); }
				}
				// food vacuoles
				for (let i = 0; i < ri(4, 8); i++) { wob(rr(-len * 0.3, len * 0.2), rr(-w * 0.2, w * 0.2), sz * rr(0.015, 0.04), 0.2); ctx.fillStyle = hsl(hue - 40 + ri(0, 80), 50, 45, rr(0.12, 0.25)); ctx.fill(); }
				// cilia
				for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2; const m = slipR(a); const bx = Math.cos(a) * len / 2 * m.rx, by = Math.sin(a) * w / 2 * m.ry; const cl = sz * rr(0.06, 0.12); const outA = Math.atan2(by, bx) + rr(-0.3, 0.3); ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx + Math.cos(outA) * cl * 0.7, by + Math.sin(outA) * cl * 0.7, bx + Math.cos(outA + 0.3) * cl, by + Math.sin(outA + 0.3) * cl); ctx.strokeStyle = hsl(hue, 50, 60, rr(0.12, 0.25)); ctx.lineWidth = 0.4; ctx.stroke(); }
				ctx.restore();
			}
			if (variant === 2) { ctx.beginPath(); ctx.moveTo(0, -w * 0.6); ctx.lineTo(0, w * 0.6); ctx.strokeStyle = hsl(hue, 60, 55, 0.3); ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]); }
			ctx.restore();
		}

		// === AMOEBA ===
		function drawAmoeba(x, y, sz, hue) {
			ctx.save(); ctx.translate(x, y); ctx.rotate(rr(0, Math.PI * 2));
			const variant = ri(0, 3);
			ctx.save(); ctx.globalCompositeOperation = 'screen'; glow(0, 0, sz * 0.9, hue, 60, 45, 0.12); ctx.restore();
			const podCount = variant === 2 ? ri(1, 3) : ri(3, 6);
			const podAngles = []; for (let i = 0; i < podCount; i++)podAngles.push(rr(0, Math.PI * 2));
			const podWidths = podAngles.map(() => rr(0.3, 0.6));
			const n = 48, pts = [];
			for (let i = 0; i < n; i++) {
				const a = i / n * Math.PI * 2; let r = sz * (variant === 2 ? 0.42 : 0.35 + rr(0, 0.1));
				for (let p = 0; p < podAngles.length; p++) { let diff = Math.abs(a - podAngles[p]); if (diff > Math.PI) diff = Math.PI * 2 - diff; if (diff < podWidths[p]) r += sz * (variant === 2 ? 0.1 : 0.18 + rr(0, 0.15)) * (1 - diff / podWidths[p]); }
				if (variant === 2) r += Math.sin(a * ri(8, 15)) * sz * 0.02;
				pts.push([Math.cos(a) * r + rr(-sz * 0.01, sz * 0.01), Math.sin(a) * r + rr(-sz * 0.01, sz * 0.01)]);
			}
			ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
			for (let i = 0; i < n; i++) { const c2 = pts[(i + 1) % n], c3 = pts[(i + 2) % n]; ctx.quadraticCurveTo(c2[0], c2[1], (c2[0] + c3[0]) / 2, (c2[1] + c3[1]) / 2); }
			ctx.closePath();
			const g = ctx.createRadialGradient(0, 0, sz * 0.1, 0, 0, sz * 0.6);
			g.addColorStop(0, hsl(hue, 55, 58, 0.3)); g.addColorStop(0.5, hsl(hue, 50, 48, 0.22)); g.addColorStop(0.8, hsl(hue, 45, 42, 0.12)); g.addColorStop(1, hsl(hue, 55, 50, 0.18));
			ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = hsl(hue, 65, 55, 0.5); ctx.lineWidth = variant === 2 ? 1.5 : 1.2; ctx.stroke();
			if (variant === 2) { for (let i = 0; i < 20; i++) { const ba = rr(0, Math.PI * 2), br = sz * rr(0.3, 0.45); wob(Math.cos(ba) * br, Math.sin(ba) * br, sz * rr(0.01, 0.02), 0.25); ctx.fillStyle = hsl(hue + 10, 50, 50, 0.15); ctx.fill(); } }
			if (variant !== 2) for (const pa of podAngles) { const r = sz * rr(0.45, 0.55); wob(Math.cos(pa) * r, Math.sin(pa) * r, sz * rr(0.06, 0.1), 0.2); ctx.fillStyle = hsl(hue, 30, 60, 0.08); ctx.fill(); }
			// nucleus
			const nx = rr(-sz * 0.08, sz * 0.08), ny = rr(-sz * 0.08, sz * 0.08), nr = sz * rr(0.1, 0.17);
			wob(nx, ny, nr, 0.12);
			const ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, nr); ng.addColorStop(0, hsl(hue + 40, 75, 60, 0.45)); ng.addColorStop(1, hsl(hue + 40, 55, 42, 0.12));
			ctx.fillStyle = ng; ctx.fill(); ctx.strokeStyle = hsl(hue + 40, 65, 52, 0.4); ctx.lineWidth = 0.8; ctx.stroke();
			wob(nx + nr * rr(0.05, 0.2), ny - nr * rr(0, 0.15), nr * rr(0.25, 0.35), 0.15); ctx.fillStyle = hsl(hue + 50, 80, 55, 0.5); ctx.fill();
			// ingested prey
			if (variant === 1) { for (let i = 0; i < ri(1, 3); i++) { const pr = sz * rr(0.04, 0.08); wob(rr(-sz * 0.2, sz * 0.2), rr(-sz * 0.2, sz * 0.2), pr, 0.18); const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, pr); pg.addColorStop(0, hsl(hue + 120, 50, 45, 0.3)); pg.addColorStop(1, hsl(hue + 120, 40, 35, 0.08)); ctx.fillStyle = pg; ctx.fill(); ctx.strokeStyle = hsl(hue + 120, 45, 40, 0.2); ctx.lineWidth = 0.5; ctx.stroke(); } }
			// contractile vacuole
			wob(sz * rr(-0.15, 0.15), sz * rr(-0.15, 0.15), sz * rr(0.04, 0.06), 0.2);
			ctx.strokeStyle = hsl(hue, 45, 60, 0.3); ctx.lineWidth = 0.8; ctx.stroke();
			// granules
			for (let i = 0; i < ri(15, 35); i++) { const gx = rr(-sz * 0.4, sz * 0.4), gy = rr(-sz * 0.4, sz * 0.4); if (Math.hypot(gx, gy) > sz * 0.45) continue; wob(gx, gy, rr(0.4, sz * 0.02), 0.3); ctx.fillStyle = hsl(hue + ri(-40, 40), 50, 52, rr(0.1, 0.22)); ctx.fill(); }
			ctx.restore();
		}

		// === EUGLENA ===
		function drawEuglena(x, y, sz, hue) {
			ctx.save(); ctx.translate(x, y); ctx.rotate(rr(0, Math.PI * 2));
			const len = sz * rr(1.8, 2.5), w = sz * rr(0.3, 0.42);
			const variant = ri(0, 3);
			const wMod = variant === 1 ? rr(1.4, 1.7) : 1;
			const bodyBend = rr(-0.08, 0.08);
			ctx.save(); ctx.globalCompositeOperation = 'screen'; glow(0, 0, len * 0.5, hue, 65, 48, 0.12); ctx.restore();
			ctx.beginPath();
			for (let i = 0; i <= 80; i++) {
				const t = i / 80, a = t * Math.PI * 2; let rx = len / 2, ry = w / 2 * wMod;
				if (variant !== 1) { const taper = Math.exp(-Math.pow((a - Math.PI) / 0.8, 2)) * 0.3; rx *= 1 - taper; }
				ry *= 1 + Math.sin(a * 3) * 0.08 + Math.sin(a * 5.1) * 0.04;
				const bend = Math.sin(a) * bodyBend * len;
				ctx.lineTo(Math.cos(a) * rx, Math.sin(a) * ry + bend);
			}
			ctx.closePath();
			const g = ctx.createLinearGradient(-len / 2, 0, len / 2, 0);
			g.addColorStop(0, hsl(hue, 50, 40, 0.12)); g.addColorStop(0.3, hsl(hue, 60, 50, 0.3)); g.addColorStop(0.7, hsl(hue, 55, 48, 0.28)); g.addColorStop(1, hsl(hue, 45, 38, 0.1));
			ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = hsl(hue, 65, 55, 0.5); ctx.lineWidth = 1; ctx.stroke();
			// pellicle
			ctx.save(); ctx.clip(); ctx.strokeStyle = hsl(hue, 40, 55, 0.06); ctx.lineWidth = 0.4;
			for (let i = -15; i <= 15; i++) { ctx.beginPath(); ctx.moveTo(-len / 2, i * w * 0.07); ctx.quadraticCurveTo(0, i * w * 0.07 + w * rr(0.1, 0.2), len / 2, i * w * 0.07); ctx.stroke(); } ctx.restore();
			// chloroplasts
			const cCount = variant === 2 ? ri(12, 22) : ri(6, 14);
			for (let i = 0; i < cCount; i++) {
				const ca = rr(0, Math.PI * 2), cd = rr(sz * 0.05, len * 0.3); ctx.save(); ctx.translate(Math.cos(ca) * cd * 0.5, Math.sin(ca) * cd * 0.3); ctx.rotate(ca);
				wobEllipse(0, 0, sz * rr(0.04, variant === 2 ? 0.1 : 0.09), sz * rr(0.012, 0.025), 0, 0.15);
				ctx.fillStyle = hsl(hue - 15, variant === 2 ? 75 : 70, 42, rr(0.2, variant === 2 ? 0.5 : 0.4)); ctx.fill(); ctx.restore();
			}
			// paramylon
			for (let i = 0; i < ri(2, variant === 2 ? 8 : 4); i++) { wobEllipse(rr(-len * 0.2, len * 0.1), rr(-w * 0.15, w * 0.15), sz * 0.018, sz * 0.012, rr(0, Math.PI), 0.2); ctx.fillStyle = hsl(hue + 20, 35, 65, 0.25); ctx.fill(); }
			// nucleus
			wobEllipse(len * rr(0.02, 0.08), rr(-w * 0.05, w * 0.05), sz * rr(0.06, 0.08), sz * rr(0.04, 0.06), rr(-0.3, 0.3), 0.12);
			ctx.fillStyle = hsl(hue + 35, 65, 52, 0.35); ctx.fill(); ctx.strokeStyle = hsl(hue + 35, 55, 48, 0.25); ctx.lineWidth = 0.5; ctx.stroke();
			// reservoir
			wobEllipse(len * rr(0.35, 0.4), rr(-w * 0.03, w * 0.03), sz * rr(0.03, 0.04), sz * rr(0.02, 0.03), 0, 0.15);
			ctx.strokeStyle = hsl(hue, 45, 55, 0.2); ctx.lineWidth = 0.5; ctx.stroke();
			// eyespot
			wob(len * rr(0.33, 0.37), w * rr(0.08, 0.15) * wMod, sz * rr(0.02, 0.03), 0.15);
			ctx.fillStyle = hsl(15, 85, 48, 0.6); ctx.fill();
			// flagellum
			ctx.beginPath(); let fx = len * rr(0.4, 0.44), fy = rr(-w * 0.05, w * 0.05); ctx.moveTo(fx, fy);
			const flagAmp = rr(0.03, 0.06), flagFreq = rr(2.5, 4);
			for (let i = 1; i <= 25; i++) { const t = i / 25; fx += sz * rr(0.03, 0.06); fy += Math.sin(t * Math.PI * flagFreq + rr(0, 1)) * sz * flagAmp * (1 - t * 0.5); ctx.lineTo(fx, fy); }
			ctx.strokeStyle = hsl(hue, 55, 55, 0.35); ctx.lineWidth = 0.7; ctx.lineCap = 'round'; ctx.stroke();
			if (variant === 0 && Math.random() > 0.5) { ctx.beginPath(); fx = -len * 0.45; fy = 0; ctx.moveTo(fx, fy); for (let i = 1; i <= 15; i++) { fx -= sz * 0.03; fy += Math.sin(i * 0.5) * sz * 0.02; ctx.lineTo(fx, fy); } ctx.strokeStyle = hsl(hue, 45, 50, 0.15); ctx.lineWidth = 0.4; ctx.stroke(); }
			ctx.restore();
		}

		// === STENTOR ===
		function drawStentor(x, y, sz, hue) {
			ctx.save(); ctx.translate(x, y); ctx.rotate(rr(0, Math.PI * 2));
			const len = sz * rr(2, 3), wTop = sz * rr(0.6, 0.9), wBot = sz * rr(0.12, 0.2);
			const variant = ri(0, 2);
			const bodyHue = variant === 0 ? 220 : hue;
			const bendX = rr(-wTop * 0.15, wTop * 0.15);
			const topAsymL = rr(0.85, 1.15), topAsymR = rr(0.85, 1.15);
			ctx.save(); ctx.globalCompositeOperation = 'screen'; glow(bendX, -len * 0.3, wTop, bodyHue, 65, 48, 0.14); ctx.restore();
			ctx.beginPath();
			ctx.moveTo(-wBot / 2 + rr(-2, 2), len * 0.4);
			ctx.bezierCurveTo(-wBot / 2 + rr(-3, 3), len * 0.1 + rr(-5, 5), -wTop / 2 * topAsymL + bendX + rr(-3, 3), -len * 0.3 + rr(-3, 3), -wTop / 2 * topAsymL + bendX, -len * 0.42 + rr(-5, 5));
			ctx.bezierCurveTo(-wTop * 0.3 * topAsymL + bendX, -len * 0.52 + rr(-3, 3), wTop * 0.3 * topAsymR + bendX, -len * 0.52 + rr(-3, 3), wTop / 2 * topAsymR + bendX, -len * 0.42 + rr(-5, 5));
			ctx.bezierCurveTo(wTop / 2 * topAsymR + bendX + rr(-3, 3), -len * 0.3 + rr(-3, 3), wBot / 2 + rr(-3, 3), len * 0.1 + rr(-5, 5), wBot / 2 + rr(-2, 2), len * 0.4);
			ctx.bezierCurveTo(wBot * 0.1, len * 0.45 + rr(-2, 2), -wBot * 0.1, len * 0.45 + rr(-2, 2), -wBot / 2 + rr(-2, 2), len * 0.4);
			ctx.closePath();
			const bg = ctx.createLinearGradient(0, len * 0.4, bendX, -len * 0.5);
			bg.addColorStop(0, hsl(bodyHue, 55, 38, 0.15)); bg.addColorStop(0.3, hsl(bodyHue, 60, 48, 0.3)); bg.addColorStop(0.7, hsl(bodyHue, 55, 52, 0.35)); bg.addColorStop(1, hsl(bodyHue, 50, 45, 0.2));
			ctx.fillStyle = bg; ctx.fill(); ctx.strokeStyle = hsl(bodyHue, 65, 55, 0.5); ctx.lineWidth = 1.2; ctx.stroke();
			if (variant === 0) {
				ctx.save(); ctx.clip(); ctx.strokeStyle = hsl(210, 60, 40, 0.12); ctx.lineWidth = 0.5;
				for (let i = -10; i <= 10; i++) { ctx.beginPath(); const off = i * wTop * 0.045; ctx.moveTo(off * 0.3 + rr(-1, 1), len * 0.4); ctx.quadraticCurveTo(off * 0.5 + bendX * 0.5 + rr(-2, 2), 0, off + bendX + rr(-2, 2), -len * 0.45); ctx.stroke(); } ctx.restore();
			}
			if (variant === 1) { for (let i = 0; i < ri(20, 40); i++) { const ay = rr(-len * 0.4, len * 0.3); const aw = wBot / 2 + (wTop / 2 - wBot / 2) * (-ay + len * 0.4) / (len * 0.9); wob(rr(-aw * 0.7, aw * 0.7) + bendX * (0.5 - ay / len), ay, sz * rr(0.008, 0.018), 0.25); ctx.fillStyle = hsl(120, 65, 42, rr(0.2, 0.4)); ctx.fill(); } }
			// AZM
			wobEllipse(bendX, -len * 0.47, wTop * rr(0.35, 0.48), wTop * rr(0.08, 0.15), rr(-0.1, 0.1), 0.1);
			ctx.strokeStyle = hsl(bodyHue + 15, 55, 55, 0.35); ctx.lineWidth = 0.7; ctx.stroke();

				ctx.beginPath(); ctx.moveTo(-len * rr(0.38, 0.44), rr(-1, 1)); ctx.lineTo(len * rr(0.38, 0.44), rr(-1, 1)); ctx.strokeStyle = hsl(hue + 10, 55, 50, 0.35); ctx.lineWidth = 0.7; ctx.stroke();
				wob(0, 0, sz * rr(0.015, 0.025), 0.2); ctx.fillStyle = hsl(hue + 10, 60, 55, 0.4); ctx.fill();
				const striae = ri(12, 28); ctx.strokeStyle = hsl(hue, 45, 52, 0.12); ctx.lineWidth = 0.3;
				for (let i = 1; i < striae; i++) { const sx = (-0.42 + i / striae * 0.84) * len; ctx.beginPath(); ctx.moveTo(sx + rr(-0.5, 0.5), -w * rr(0.3, 0.4)); ctx.lineTo(sx + rr(-0.5, 0.5), w * rr(0.3, 0.4)); ctx.stroke(); }
			}
			else if (type === 1) {
				const r = sz * rr(0.45, 0.65); const squash = rr(0.9, 1.1);
				wobEllipse(0, 0, r, r * squash, rr(-0.2, 0.2), 0.06); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r); g.addColorStop(0, hsl(hue, 60, 55, 0.35)); g.addColorStop(1, hsl(hue, 50, 42, 0.15)); ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = hsl(hue, 65, 52, 0.5); ctx.lineWidth = 1; ctx.stroke();
				const rings = ri(3, 6); for (let ring = 1; ring <= rings; ring++) {
					const rr2 = r * ring / (rings + 1); const pores = ring * ri(5, 7);
					for (let p = 0; p < pores; p++) { const a = p / pores * Math.PI * 2 + rr(-0.1, 0.1); wob(Math.cos(a) * rr2, Math.sin(a) * rr2 * squash, r * rr(0.02, 0.03), 0.2); ctx.fillStyle = hsl(hue + 5, 50, 48, 0.15); ctx.fill(); }
					wobEllipse(0, 0, rr2, rr2 * squash, 0, 0.05); ctx.strokeStyle = hsl(hue, 50, 50, 0.1); ctx.lineWidth = 0.3; ctx.stroke();
				}
				wob(0, 0, r * rr(0.05, 0.08), 0.18); ctx.fillStyle = hsl(hue + 20, 65, 55, 0.4); ctx.fill();
			}
			else {
				const lobes = ri(3, 5), r = sz * rr(0.4, 0.6); ctx.beginPath();
				for (let i = 0; i <= 80; i++) { const a = i / 80 * Math.PI * 2; const lobe = 0.6 + 0.4 * Math.pow((Math.cos(a * lobes) + 1) / 2, 0.6) + rr(-0.03, 0.03); ctx.lineTo(Math.cos(a) * r * lobe, Math.sin(a) * r * lobe * rr(0.65, 0.8)); }
				ctx.closePath(); ctx.fillStyle = hsl(hue, 55, 50, 0.2); ctx.fill(); ctx.strokeStyle = hsl(hue, 65, 52, 0.45); ctx.lineWidth = 1; ctx.stroke();
				ctx.beginPath(); for (let i = 0; i <= 80; i++) { const a = i / 80 * Math.PI * 2; const lobe = 0.6 + 0.4 * Math.pow((Math.cos(a * lobes) + 1) / 2, 0.6); ctx.lineTo(Math.cos(a) * r * lobe * 0.5, Math.sin(a) * r * lobe * rr(0.3, 0.4)); } ctx.closePath(); ctx.strokeStyle = hsl(hue, 50, 48, 0.2); ctx.lineWidth = 0.5; ctx.stroke();
				wob(0, 0, r * rr(0.08, 0.12), 0.18); ctx.fillStyle = hsl(hue + 20, 60, 55, 0.35); ctx.fill();
			}
			ctx.restore();
		}

		function drawFilament(hue, W, H) { ctx.beginPath(); let x = rr(-50, W + 50), y = rr(-50, H + 50); ctx.moveTo(x, y); for (let i = 0; i < ri(5, 12); i++) { x += rr(-150, 150); y += rr(-150, 150); ctx.lineTo(x, y); } ctx.strokeStyle = hsl(hue + rr(-40, 40), 35, 45, rr(0.03, 0.08)); ctx.lineWidth = rr(0.3, 1.2); ctx.stroke(); }

		function generate() {
			const W = c.width, H = c.height, dim = Math.min(W, H);
			const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, dim * 0.7); const bgH = ri(200, 270);
			bg.addColorStop(0, hsl(bgH, 35, 9, 1)); bg.addColorStop(1, hsl(bgH, 25, 3, 1));
			ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
			const scopeR = dim * 0.46;
			ctx.save(); ctx.globalCompositeOperation = 'destination-in'; ctx.beginPath(); ctx.arc(W / 2, H / 2, scopeR, 0, Math.PI * 2); ctx.fill(); ctx.restore();
			ctx.save(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(W / 2, H / 2, scopeR, 0, Math.PI * 2, true); ctx.fill(); ctx.restore();
			ctx.strokeStyle = 'rgba(40,60,80,0.3)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(W / 2, H / 2, scopeR, 0, Math.PI * 2); ctx.stroke();
			const hues = [rr(0, 360), rr(0, 360), rr(0, 360)];
			for (let i = 0; i < ri(8, 20); i++)drawFilament(pick(hues), W, H);
			for (let i = 0; i < ri(80, 200); i++) { const px = W / 2 + rr(-scopeR, scopeR), py = H / 2 + rr(-scopeR, scopeR); if (Math.hypot(px - W / 2, py - H / 2) > scopeR) continue; const r = rr(0.5, 3); const gg = ctx.createRadialGradient(px, py, 0, px, py, r); gg.addColorStop(0, hsl(pick(hues) + rr(-30, 30), 45, 50, rr(0.05, 0.15))); gg.addColorStop(1, 'transparent'); ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill(); }
			const drawFuncs = [drawParamecium, drawAmoeba, drawEuglena, drawVorticella, drawRotifer, drawDiatom, drawBacteria, drawStentor, drawVolvox, drawSpirogyra];
			const placed = [];
			for (let attempt = 0; attempt < 500 && placed.length < ri(8, 14); attempt++) {
				const sz = dim * rr(0.03, 0.1); const ox = W / 2 + rr(-scopeR * 0.75, scopeR * 0.75); const oy = H / 2 + rr(-scopeR * 0.75, scopeR * 0.75); if (Math.hypot(ox - W / 2, oy - H / 2) + sz > scopeR * 0.88) continue; let ok = true;
				for (const p of placed) { if (Math.hypot(ox - p.x, oy - p.y) < (sz + p.sz) * 0.85) { ok = false; break; } }
				if (!ok) continue; placed.push({ x: ox, y: oy, sz }); pick(drawFuncs)(ox, oy, sz, pick(hues));
			}
			ctx.save(); ctx.globalCompositeOperation = 'screen'; for (let i = 0; i < ri(5, 12); i++) { const bx = W / 2 + rr(-scopeR, scopeR), by = H / 2 + rr(-scopeR, scopeR); if (Math.hypot(bx - W / 2, by - H / 2) > scopeR) continue; const br = rr(dim * 0.015, dim * 0.05); wob(bx, by, br, 0.1); ctx.strokeStyle = hsl(pick(hues) + rr(-20, 20), 35, 50, rr(0.02, 0.05)); ctx.lineWidth = 1.5; ctx.stroke(); } ctx.restore();
			// vignette FIRST
			const eg = ctx.createRadialGradient(W / 2, H / 2, scopeR * 0.85, W / 2, H / 2, scopeR); eg.addColorStop(0, 'transparent'); eg.addColorStop(1, 'rgba(0,0,0,0.6)'); ctx.fillStyle = eg; ctx.fillRect(0, 0, W, H);
			// labels AFTER vignette so they don't get darkened
			ctx.save();
			ctx.fillStyle = 'rgba(180,220,255,0.5)';
			ctx.shadowColor = 'rgba(100,200,255,0.4)';
			ctx.shadowBlur = 12;
			ctx.font = `${dim * 0.020 | 0}px monospace`;
			ctx.textAlign = 'left';
			ctx.fillText(`${pick(["100x", "200x", "400x", "630x", "1000x"])} ${pick(["DARK FIELD", "FLUORESCENCE", "PHASE CONTRAST", "DIC", "CONFOCAL"])}`, W / 2 - scopeR + 15, H / 2 + scopeR - 15);
			ctx.textAlign = 'right';
			ctx.fillText(pick(["POND WATER", "ESTUARY", "SOIL EXTRACT", "BIOFILM", "HYDROTHERMAL VENT", "CORAL MICROBIOME", "GLACIAL MELT", "LEAF LITTER", "SLUDGE", "PEAT BOG"]), W / 2 + scopeR - 15, H / 2 + scopeR - 15);
			const barW = dim * 0.07;
			ctx.strokeStyle = 'rgba(180,220,255,0.4)';
			ctx.lineWidth = 1.5;
			ctx.beginPath();
			ctx.moveTo(W / 2 + scopeR - barW - 20, H / 2 - scopeR + 20);
			ctx.lineTo(W / 2 + scopeR - 20, H / 2 - scopeR + 20);
			ctx.stroke();
			ctx.font = `${dim * 0.020 | 0}px monospace`;
			ctx.fillText(`${ri(10, 500)} μm`, W / 2 + scopeR - 20, H / 2 - scopeR + 14);
			ctx.shadowBlur = 0;
			ctx.restore();
		}
		function resize() { c.width = window.innerWidth; c.height = window.innerHeight; generate(); }
		resize(); window.addEventListener('resize', resize); c.addEventListener('click', generate);
	</script>
