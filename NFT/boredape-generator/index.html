<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Ugly Ass NFT Ape Generator</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			background: #1a1a2e;
			color: #eee;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center
		}

		h1 {
			font-size: 1.3rem;
			padding: 12px;
			text-align: center;
			background: #16213e;
			width: 100%;
			color: #e94560
		}

		.app {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 16px;
			padding: 16px;
			max-width: 1100px;
			width: 100%
		}

		.preview-wrap {
			position: relative;
			flex-shrink: 0
		}

		canvas {
			display: block;
			border: 3px solid #e94560;
			border-radius: 8px;
			background: #222;
			image-rendering: pixelated
		}

		.controls {
			flex: 1;
			min-width: 300px;
			max-width: 500px;
			display: flex;
			flex-direction: column;
			gap: 8px
		}

		.tabs {
			display: flex;
			flex-wrap: wrap;
			gap: 4px;
			align-items: flex-end
		}

		.tab {
			width: 48px;
			height: 48px;
			border: 2px solid #333;
			border-bottom: none;
			border-radius: 8px 8px 0 0;
			cursor: pointer;
			background-color: #16213e;
			background-size: 70%;
			background-repeat: no-repeat;
			background-position: center;
			transition: .2s;
			flex-shrink: 0
		}

		.tab:hover {
			border-color: #e94560;
			background-color: #1a1a4e
		}

		.tab.active {
			border-color: #e94560;
			background-color: #2a1a3e;
			box-shadow: 0 0 6px #e9456066
		}

		.items-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
			gap: 6px;
			padding: 10px;
			background: #16213e;
			border-radius: 0 8px 8px 8px;
			max-height: 340px;
			overflow-y: auto;
			min-height: 120px
		}

		.items-grid::-webkit-scrollbar {
			width: 6px
		}

		.items-grid::-webkit-scrollbar-thumb {
			background: #e94560;
			border-radius: 3px
		}

		.item {
			width: 100%;
			aspect-ratio: 1;
			border: 2px solid #444;
			border-radius: 6px;
			cursor: pointer;
			background-size: contain;
			background-repeat: no-repeat;
			background-position: center;
			background-color: #555;
			transition: .15s
		}

		.item:hover {
			border-color: #e94560;
			transform: scale(1.05)
		}

		.item.active {
			border-color: #e94560;
			box-shadow: 0 0 8px #e9456088
		}

		.item.none-btn {
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: .65rem;
			color: #ccc;
			font-weight: 700;
			text-transform: uppercase;
			background-color: #444
		}

		.btn-row {
			display: flex;
			gap: 8px;
			flex-wrap: wrap
		}

		.btn {
			padding: 10px 20px;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			font-weight: 700;
			font-size: .9rem;
			transition: .2s
		}

		.btn-rand {
			background: #0f3460;
			color: #fff
		}

		.btn-rand:hover {
			background: #1a4a8a
		}

		.btn-finish {
			background: #e94560;
			color: #fff
		}

		.btn-finish:hover {
			background: #ff6b81
		}

		.btn-dl {
			background: #2ecc71;
			color: #fff
		}

		.btn-dl:hover {
			background: #27ae60
		}

		.btn-back {
			background: #555;
			color: #fff
		}

		.btn-back:hover {
			background: #777
		}

		.modal {
			display: none;
			position: fixed;
			inset: 0;
			background: #000c;
			z-index: 100;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 16px
		}

		.modal.show {
			display: flex
		}

		.modal canvas {
			border-color: #e94560
		}

		.modal-btns {
			display: flex;
			gap: 12px
		}

		.part-label {
			font-size: .75rem;
			color: #888;
			padding: 2px 8px
		}
	</style>
</head>

			<div class="btn-row">

		const GLASSES_HAIR_IDX = 7;   // below hats, except above horns
		const HORN_HAT_INDICES = [1, 2, 3, 4]; // hat indices that are horns

		// ── STATE ──
		let selected = {};
		let activeTab = 0;
		let imgCache = {};
		PARTS.forEach(p => { selected[p.id] = p.defIdx; });

		function loadImg(src) {
			if (!imgCache[src]) {
				imgCache[src] = new Promise((res, rej) => {
					const img = new Image();
					img.onload = () => res(img);
					img.onerror = () => { delete imgCache[src]; rej(src); };
					img.src = `${BASE}/${src}`;
				});
			}
			return imgCache[src];
		}

		// ── Z-INDEX RESOLVER ──
		function getZ(partId, itemIdx) {
			const part = PARTS.find(p => p.id === partId);
			if (!part) return 0;

			// Special: glasses crown item → z 8.5 (above clothes 7, below meme 9)
			if (partId === 'glasses' && itemIdx === GLASSES_CROWN_IDX) return 8.5;

			// Special: glasses hair item
			if (partId === 'glasses' && itemIdx === GLASSES_HAIR_IDX) {
				const hatIdx = selected['hat'];
				// If hat is horns (or no hat), hair stays at normal z (above hat)
				if (hatIdx === -1 || HORN_HAT_INDICES.includes(hatIdx)) return 4.5;
				// Otherwise hair goes BELOW the hat
				return 3.5;
			}

			return part.baseZ;
		}

		// ── RENDER ──

			console.log(`[render] START target=${canvasId}`);
			const cvs = document.getElementById(canvasId);
			if (!cvs) { console.error(`[render] canvas #${canvasId} not found!`); return; }
			const ctx = cvs.getContext('2d');
			if (!ctx) { console.error(`[render] failed to get 2d context for #${canvasId}`); return; }
			console.log(`[render] canvas size: ${cvs.width}x${cvs.height}, display: ${getComputedStyle(cvs).display}, parent visible: ${cvs.offsetParent !== null}`);
			ctx.clearRect(0, 0, 600, 600);

			const layers = [];
			PARTS.forEach(p => {
				const idx = selected[p.id];
				if (idx >= 0 && p.items[idx]) {
					layers.push({ z: getZ(p.id, idx), img: p.items[idx].img, partId: p.id, idx });
				}
			});
			layers.sort((a, b) => a.z - b.z);
			console.log(`[render] ${layers.length} layers to draw:`, layers.map(l => `${l.partId}[${l.idx}] z=${l.z}`));

			for (const l of layers) {
				try {
					console.log(`[render] loading ${l.img}...`);
					const img = await loadImg(l.img);
					console.log(`[render] loaded ${l.img} → ${img.naturalWidth}x${img.naturalHeight} complete=${img.complete}`);
					ctx.drawImage(img, 0, 0, 600, 600);
					console.log(`[render] drew ${l.img} OK`);
				} catch (e) { console.warn('[render] FAILED to load:', l.img, e); }
			}

			// Check if canvas has any non-transparent pixels
			const pixel = ctx.getImageData(300, 300, 1, 1).data;
			console.log(`[render] DONE. Center pixel RGBA: ${pixel[0]},${pixel[1]},${pixel[2]},${pixel[3]} (0,0,0,0 = blank)`);
		}

		// ── UI ──
		function buildTabs() {
			const el = document.getElementById('tabs');
			el.innerHTML = '';
			PARTS.forEach((p, i) => {
				const btn = document.createElement('div');
				btn.className = 'tab' + (i === activeTab ? ' active' : '');
				btn.style.backgroundImage = `url(${BASE}/${p.icon})`;
				btn.title = p.name;
				btn.onclick = () => { activeTab = i; buildTabs(); buildItems(); };
				el.appendChild(btn);
			});
		}

		function buildItems() {
			const grid = document.getElementById('itemsGrid');
			const label = document.getElementById('partLabel');
			const part = PARTS[activeTab];
			label.textContent = part.name + (part.removable ? ' (optional)' : '');
			grid.innerHTML = '';

			if (part.removable) {
				const none = document.createElement('div');
				none.className = 'item none-btn' + (selected[part.id] === -1 ? ' active' : '');
				none.textContent = '✕ None';
				none.onclick = () => { selected[part.id] = -1; buildItems(); render('preview'); };
				grid.appendChild(none);
			}

			part.items.forEach((item, idx) => {
				const div = document.createElement('div');
				div.className = 'item' + (selected[part.id] === idx ? ' active' : '');
				div.style.backgroundImage = `url(${BASE}/${item.thumb})`;
				div.onclick = () => { selected[part.id] = idx; buildItems(); render('preview'); };
				grid.appendChild(div);
			});
		}

		function randomize() {
			PARTS.forEach(p => {
				if (p.removable && Math.random() < 0.2) {
					selected[p.id] = -1;
				} else {
					selected[p.id] = Math.floor(Math.random() * p.items.length);
				}
			});
			buildItems();
			render('preview');
		}

		async function finish() {
			// Ensure preview is fully rendered, then snapshot it as a PNG data URL
			await render('preview');
			const dataUrl = document.getElementById('preview').toDataURL('image/png');
			document.getElementById('finalImg').src = dataUrl;
			document.getElementById('modal').classList.add('show');
		}

		function closeModal() {
			document.getElementById('modal').classList.remove('show');
		}

		function download() {
			const a = document.createElement('a');
			a.download = 'nft-ape.png';
			a.href = document.getElementById('finalImg').src;
			a.click();
		}

		buildTabs();
		buildItems();
		render('preview');
	</script>
</body>

</html>
